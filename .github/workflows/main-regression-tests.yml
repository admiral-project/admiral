name: Main Regression Tests

on:
  push:
    branches:
      - main

jobs:
  scripts-regression:
    name: Scripts regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run targeted regression tests
        run: |
          python -m pytest -q \
            scripts/test_admiral_https_setup.py \
            scripts/test_wireguard_peers.py \
            scripts/test_installer_modes.py \
            scripts/test_rootless_subids.py