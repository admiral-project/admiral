name: Main Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scripts-regression:
    name: Scripts regression suite
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml jinja2

      - name: Run targeted regression tests
        run: python -m pytest -q scripts/test_*.py

  admiralctl-local-layout:
    name: admiralctl local source-layout checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: admiralctl/go.mod

      - name: Test the RPM-equivalent local layout
        run: make test-admiralctl-local
