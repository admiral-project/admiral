; Admiral Control Plane default configuration
; This file is installed by the admirald RPM.
; Override any value via the corresponding ADMIRAL_* environment variable.

port=8080
listen_address=127.0.0.1
database_url=__REQUIRED__
queue_database_url=__REQUIRED__
admin_token=__REQUIRED__
token_pepper=__REQUIRED__
secrets_key=__REQUIRED__
flagship_admin_user=__REQUIRED__
flagship_admin_pswd=__REQUIRED__

tls_cert_file=/etc/admiral/tls/admirald.pem
tls_key_file=/etc/admiral/tls/admirald-key.pem

networking_base_domain=
networking_tls_provider=letsencrypt
networking_tls_email=
networking_admin_target=
networking_portal_target=https://127.0.0.1:5001
networking_flagship_target=https://127.0.0.1:5000
networking_cockpit_target=http://127.0.0.1:9090
caddy_admin_url=http://127.0.0.1:2019
