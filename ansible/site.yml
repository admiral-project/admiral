---
- name: Configure Admiral platform
  hosts: all
  gather_facts: true
  become: true

  roles:
    - admiral_common
    - admiral_selinux
    - admiral_firewall
    - admiral_wireguard
    - role: admirald
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_fleet
      when: admiral_install_mode in ['single-node', 'worker-node', 'portal-node']
    - role: admiral_flagship
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_harbor
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_cockpit
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_ssh_tunnel
      when:
        - admiral_install_mode in ['worker-node', 'portal-node']
        - admiral_enable_ssh_tunnel | default(false) | bool
