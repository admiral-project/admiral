---
- name: Configure Admiral platform
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Check active admin services for portal-node
      command:
        cmd: systemctl is-active --quiet {{ item }}
      register: admiral_portal_admin_service_state
      changed_when: false
      failed_when: false
      loop:
        - caddy
        - admirald
      when: admiral_install_mode == 'portal-node'

    - name: Determine whether portal-node shares a running admin host
      set_fact:
        admiral_portal_shares_admin_host: >-
          {{
            (
              admiral_portal_admin_service_state.results
              | selectattr('item', 'equalto', 'caddy')
              | map(attribute='rc')
              | first
              | default(1)
            ) == 0 and
            (
              admiral_portal_admin_service_state.results
              | selectattr('item', 'equalto', 'admirald')
              | map(attribute='rc')
              | first
              | default(1)
            ) == 0
          }}
      when: admiral_install_mode == 'portal-node'

    - name: Determine WireGuard role
      set_fact:
        admiral_wireguard_role: "{{ 'hub' if admiral_install_mode in ['single-node', 'admin-node'] or (admiral_install_mode == 'portal-node' and (admiral_portal_shares_admin_host | default(false) | bool)) else 'spoke' }}"

    - name: Create Admiral bootstrap directories on remote spokes
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /etc/admiral
        - /etc/admiral/tls
        - /etc/wireguard
        - /var/lib/admiral
      when:
        - admiral_install_mode in ['worker-node', 'portal-node']
        - admiral_bootstrap_from_controller | default(false) | bool

    - name: Copy admin bootstrap materials to remote spokes
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "/etc/admiral/secrets", dest: "/etc/admiral/secrets", mode: "0600" }
        - { src: "/etc/admiral/tls/ca.pem", dest: "/etc/admiral/tls/ca.pem", mode: "0644" }
        - { src: "/var/lib/admiral/know_host.yaml", dest: "/var/lib/admiral/know_host.yaml", mode: "0644" }
        - { src: "/etc/wireguard/admiral.pub", dest: "/etc/wireguard/admiral.pub", mode: "0644" }
      when:
        - admiral_install_mode in ['worker-node', 'portal-node']
        - admiral_bootstrap_from_controller | default(false) | bool

  roles:
    - admiral_common
    - admiral_selinux
    - admiral_firewall
    - admiral_auditd
    - role: admiral_fail2ban
      when: not (admiral_dev_mode | default(false) | bool)
    - role: admiral_wireguard
      vars:
        admiral_wireguard_role: "{{ admiral_wireguard_role }}"
      when: not (admiral_install_mode == 'portal-node' and (admiral_portal_shares_admin_host | default(false) | bool))
    - role: admirald
      when: admiral_install_mode in ['single-node', 'admin-node']
    # Remote spoke hosts are role-exclusive: a worker spoke cannot also be a
    # portal spoke. --single-node is the only supported mode that combines both.
    # In --single-node, harbor uses a "-portal" node ID suffix while fleet uses
    # the bare hostname, so both register without colliding.
    - role: admiral_harbor
      when: admiral_install_mode in ['single-node', 'portal-node']
    - role: admiral_flagship
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_fleet
      when: admiral_install_mode in ['single-node', 'worker-node']
    - role: admiral_cockpit
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_ssh_tunnel
      when:
        - admiral_install_mode == 'worker-node'
        - admiral_enable_ssh_tunnel | default(false) | bool

  post_tasks:
    - name: Read single-node registered nodes
      command:
        cmd: /usr/bin/admiralctl nodes list --output json
      register: admiral_single_node_nodes
      changed_when: false
      environment:
        ADMIRAL_ADMIN_TOKEN: "{{ admiral_admin_token_value }}"
        ADMIRAL_SERVER_URL: "https://127.0.0.1:8080"
        ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
      when: admiral_install_mode == 'single-node'

    - name: Verify single-node worker and portal registrations
      assert:
        that:
          - ansible_hostname in ((admiral_single_node_nodes.stdout | from_json) | map(attribute='id') | list)
          - (ansible_hostname ~ '-portal') in ((admiral_single_node_nodes.stdout | from_json) | map(attribute='id') | list)
        fail_msg: >-
          Single-node install must register both '{{ ansible_hostname }}'
          and '{{ ansible_hostname }}-portal' with admirald.
      when: admiral_install_mode == 'single-node'
