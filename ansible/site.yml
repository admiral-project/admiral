---
- name: Configure Admiral platform
  hosts: all
  gather_facts: true
  become: true

  pre_tasks:
    - name: Determine WireGuard role
      set_fact:
        admiral_wireguard_role: "{{ 'hub' if admiral_install_mode in ['single-node', 'admin-node'] else 'spoke' }}"

  roles:
    - admiral_common
    - admiral_selinux
    - admiral_firewall
    - role: admiral_wireguard
      vars:
        admiral_wireguard_role: "{{ admiral_wireguard_role }}"
    - role: admirald
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_fleet
      when: admiral_install_mode in ['single-node', 'worker-node']
    - role: admiral_flagship
      when: admiral_install_mode == 'single-node'
    - role: admiral_harbor
      when: admiral_install_mode in ['single-node', 'portal-node']
    - role: admiral_cockpit
      when: admiral_install_mode in ['single-node', 'admin-node']
    - role: admiral_ssh_tunnel
      when:
        - admiral_install_mode == 'worker-node'
        - admiral_enable_ssh_tunnel | default(false) | bool
