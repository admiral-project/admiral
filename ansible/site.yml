---
- name: Configure Admiral platform
  hosts: all
  gather_facts: true
  become: true

  vars:
    # Stable hub address for the current single-hub WireGuard topology.
    # Override this variable when a future deployment uses another subnet.
    admiral_wireguard_hub_ip: "10.99.0.1"

  pre_tasks:
    - name: Map installer mode to persistent node role
      set_fact:
        admiral_node_role: >-
          {{
            'dev'
            if (admiral_dev_mode | default(false) | bool)
            else {
              'admin-node': 'admin',
              'admin-portal-node': 'admin-portal',
              'worker-node': 'worker',
              'portal-node': 'portal',
              'single-node': 'single'
            }[admiral_install_mode]
          }}

    - name: Check persistent Admiral node role
      stat:
        path: /etc/admiral/role
      register: admiral_node_role_file

    - name: Read persistent Admiral node role
      slurp:
        src: /etc/admiral/role
      register: admiral_node_role_contents
      when: admiral_node_role_file.stat.exists

    - name: Decode persistent Admiral node role
      set_fact:
        admiral_persisted_node_role: "{{ admiral_node_role_contents.content | b64decode | trim }}"
      when: admiral_node_role_file.stat.exists

    - name: Detect fresh admiral-common RPM baseline
      command: rpm -q admiral-common
      register: admiral_common_package
      changed_when: false
      failed_when: false
      when: not admiral_node_role_file.stat.exists

    - name: Detect placeholder Admirald configuration baseline
      command: grep -q '__REQUIRED__' /etc/admirald.ini
      register: admirald_placeholder_config
      changed_when: false
      failed_when: false

    - name: Detect missing Fleet callback key in Admirald configuration
      command: grep -Eq '^fleet_callback_key[[:space:]]*=' /etc/admirald.ini
      register: admirald_callback_key_configured
      changed_when: false
      failed_when: false

    - name: Check for legacy Admiral installation state
      stat:
        path: "{{ item }}"
      loop:
        - /etc/admiral/secrets
        - /etc/admiral/harbor.env
        - /etc/admiral/fleet.env
        - /etc/admirald.ini
      register: admiral_legacy_state
      when: not admiral_node_role_file.stat.exists

    - name: Reject unprofiled legacy Admiral installations
      assert:
        that:
          - >-
            (admiral_legacy_state.results | selectattr('stat.exists') | list | length) == 0 or
            (admiral_common_package.rc == 0 and
            (admiral_legacy_state.results |
            selectattr('item', 'equalto', '/etc/admiral/secrets') |
            selectattr('stat.exists') | list | length) == 0)
        fail_msg: >-
          This host has an Admiral installation without /etc/admiral/role.
          Reprovision the host or complete the documented manual migration
          before running the installer.
      when: not admiral_node_role_file.stat.exists

    - name: Reject incompatible persistent node role
      assert:
        that:
          - admiral_persisted_node_role in ['admin', 'admin-portal', 'worker', 'portal', 'single', 'dev']
          - admiral_persisted_node_role == admiral_node_role or
            (admiral_persisted_node_role == 'dev' and admiral_node_role == 'single')
        fail_msg: >-
          This host is provisioned as '{{ admiral_persisted_node_role }}' and
          cannot be provisioned as '{{ admiral_node_role }}'. Re-run the same
          role, or use the documented manual migration for admin-portal.
      when: admiral_node_role_file.stat.exists

    - name: Ensure Admiral configuration directory exists before role persistence
      file:
        path: /etc/admiral
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Persist Admiral node role
      copy:
        dest: /etc/admiral/role
        content: "{{ admiral_node_role }}\n"
        owner: root
        group: root
        mode: "0644"
      when: >-
        not admiral_node_role_file.stat.exists or
        (admiral_persisted_node_role == 'dev' and admiral_node_role == 'single')

    - name: Determine WireGuard role
      set_fact:
        admiral_wireguard_role: "{{ 'hub' if admiral_install_mode in ['single-node', 'admin-node', 'admin-portal-node'] else 'spoke' }}"

    - name: Determine effective host security profile
      set_fact:
        admiral_effective_host_profile: >-
          {{ 'single-node' if admiral_install_mode == 'single-node' else
             ('admin' if admiral_install_mode in ['admin-node', 'admin-portal-node']
              else ('worker' if admiral_install_mode == 'worker-node' else 'portal')) }}

    - name: Determine control-plane runtime address
      set_fact:
        admiral_control_plane_host: "{{ '127.0.0.1' if admiral_install_mode == 'single-node' else admiral_wireguard_hub_ip }}"
        admiral_control_plane_url: "https://{{ '127.0.0.1' if admiral_install_mode == 'single-node' else admiral_wireguard_hub_ip }}:8080"

    - name: Create Admiral bootstrap directories on remote spokes
      file:
        path: "{{ item }}"
        state: directory
      loop:
        - /etc/admiral
        - /etc/admiral/tls
        - /etc/wireguard
        - /var/lib/admiral
      when:
        - admiral_install_mode in ['worker-node', 'portal-node']
        - admiral_bootstrap_from_controller | default(false) | bool

    - name: Remove WireGuard from standalone secure single-node
      block:
        - name: Stop standalone WireGuard service
          systemd:
            name: wg-quick@wg-admiral
            state: stopped
            enabled: false
          failed_when: false
        - name: Remove standalone WireGuard configuration
          file:
            path: /etc/wireguard/wg-admiral.conf
            state: absent
      when:
        - admiral_install_mode == 'single-node'
        - not (admiral_dev_mode | default(false) | bool)

    - name: Copy admin bootstrap materials to remote spokes
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - { src: "/etc/admiral/tls/ca.pem", dest: "/etc/admiral/tls/ca.pem", mode: "0644" }
        - { src: "/etc/wireguard/admiral.pub", dest: "/etc/wireguard/admiral.pub", mode: "0644" }
      when:
        - admiral_install_mode in ['worker-node', 'portal-node']
        - admiral_bootstrap_from_controller | default(false) | bool

  roles:
    - admiral_common
    - admiral_selinux
    - admiral_firewall
    - admiral_auditd
    - role: admiral_fail2ban
      when: not (admiral_dev_mode | default(false) | bool)
    - role: admiral_wireguard
      vars:
        admiral_wireguard_role: "{{ admiral_wireguard_role }}"
      when:
        - not (admiral_install_mode == 'single-node')
    - role: admirald
      when: admiral_install_mode in ['single-node', 'admin-node', 'admin-portal-node']
    # Remote spoke hosts are role-exclusive: a worker spoke cannot also be a
    # portal spoke. --single-node is the only supported mode that combines both.
    # In --single-node, harbor uses a "-portal" node ID suffix while fleet uses
    # the bare hostname, so both register without colliding.
    - role: admiral_harbor
      when: admiral_install_mode in ['single-node', 'portal-node', 'admin-portal-node']
    - role: admiral_flagship
      when: admiral_install_mode in ['single-node', 'admin-node', 'admin-portal-node']
    - role: admiral_fleet
      when: admiral_install_mode in ['single-node', 'worker-node']
    - role: admiral_cockpit
      when: admiral_install_mode in ['single-node', 'admin-node', 'admin-portal-node', 'worker-node', 'portal-node', 'dev-node']
    - role: admiral_ssh_tunnel
      when:
        - admiral_install_mode == 'worker-node'
        - admiral_enable_ssh_tunnel | default(false) | bool

  post_tasks:
    - name: Read single-node registered nodes
      command:
        cmd: /usr/bin/admiralctl nodes list --output json
      register: admiral_single_node_nodes
      changed_when: false
      environment:
        ADMIRAL_ADMIN_TOKEN: "{{ admiral_admin_token_value }}"
        ADMIRAL_SERVER_URL: "{{ admiral_control_plane_url }}"
        ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
      when: admiral_install_mode == 'single-node'

    - name: Verify single-node worker and portal registrations
      assert:
        that:
          - ansible_hostname in ((admiral_single_node_nodes.stdout | from_json) | map(attribute='id') | list)
          - (ansible_hostname ~ '-portal') in ((admiral_single_node_nodes.stdout | from_json) | map(attribute='id') | list)
        fail_msg: >-
          Single-node install must register both '{{ ansible_hostname }}'
          and '{{ ansible_hostname }}-portal' with admirald.
      when: admiral_install_mode == 'single-node'
