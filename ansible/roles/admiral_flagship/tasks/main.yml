---
- name: Install admiral-flagship
  dnf:
    name: admiral-flagship
    state: present

- name: Deploy admiral-flagship environment
  copy:
    dest: /etc/admiral/flagship.env
    content: |
      FLAGSHIP_SECRET_KEY={{ admiral_flagship_secret_key_value }}
      ADMIRAL_API_URL=https://127.0.0.1:8080
      ADMIRAL_ADMIN_TOKEN={{ admiral_admin_token_value }}
      ADMIRAL_CA_FILE=/etc/admiral/tls/ca.pem
    mode: "0640"
    owner: root
    group: admiral
  no_log: true

- name: Ensure admiral-flagship systemd override directory exists
  file:
    path: /etc/systemd/system/admiral-flagship.service.d
    state: directory
    mode: "0755"
  when: admiral_dev_mode | default(false) | bool

- name: Relax admiral-flagship binding in dev mode
  copy:
    dest: /etc/systemd/system/admiral-flagship.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/gunicorn --workers 2 --bind 0.0.0.0:5000 run:app
      Environment=ENV=development
    mode: "0644"
  when: admiral_dev_mode | default(false) | bool

- name: Remove legacy admiral-flagship systemd override
  file:
    path: /etc/systemd/system/admiral-flagship.service.d
    state: absent
  when: not (admiral_dev_mode | default(false) | bool)

- name: Enable and start admiral-flagship
  systemd:
    name: admiral-flagship
    enabled: true
    state: started
    daemon_reload: true
