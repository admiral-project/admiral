---
- name: Ensure firewalld is installed
  package:
    name: firewalld
    state: present

- name: Unmask firewalld service
  systemd:
    name: firewalld
    masked: false

- name: Ensure firewalld is enabled and running
  systemd:
    name: firewalld
    state: started
    enabled: true
    daemon_reload: true

- name: Load nftables modules for iptables direct rules (AlmaLinux workaround)
  command:
    cmd: modprobe {{ item }}
  register: firewall_modprobe
  changed_when: false
  failed_when: false
  loop:
    - nf_conntrack
    - nft_ct
    - nft_reject_ipv4
  when: ansible_distribution in ['AlmaLinux', 'Rocky']

- name: Check if firewalld is in failed state
  command: firewall-cmd --state
  register: firewall_state_check
  changed_when: false
  failed_when: false

- name: Recover firewalld from failed state
  block:
    - name: Remove stuck permanent direct rules
      command: firewall-offline-cmd --direct --remove-rules ipv4 filter OUTPUT
      failed_when: false
    - name: Restart firewalld to clear failed state
      systemd:
        name: firewalld
        state: restarted
  when: firewall_state_check.rc != 0

- name: Use one dual-stack nftables egress policy on every supported distribution
  set_fact:
    admiral_use_nftables_egress: true

- name: Set default firewalld zone to public
  command:
    cmd: firewall-cmd --set-default-zone=public
  register: firewall_default_zone
  until: firewall_default_zone.rc == 0
  retries: 5
  delay: 2
  changed_when: "'success' in firewall_default_zone.stdout"

- name: Ensure public zone target is default deny
  command:
    cmd: firewall-cmd --permanent --zone=public --set-target=default
  register: firewall_public_target
  changed_when: "'success' in firewall_public_target.stdout"

- name: Remove broad public services from public zone
  command:
    cmd: firewall-cmd --permanent --zone=public --remove-service={{ item }}
  register: firewall_removed_service
  changed_when: "'success' in firewall_removed_service.stdout"
  failed_when: false
  loop:
    - cockpit
    - dhcpv6-client
    - mdns

- name: Remove direct public Admiral ports from public zone
  command:
    cmd: firewall-cmd --permanent --zone=public --remove-port={{ item }}
  register: firewall_removed_port
  changed_when: "'success' in firewall_removed_port.stdout"
  failed_when: false
  loop:
    - 8080/tcp
    - 8443/tcp
    - 9099/tcp
    - 2019/tcp
    - 5000/tcp
    - 5001/tcp
    - 40000-49999/tcp
    - 5432/tcp
    - 6379/tcp
    - 5671/tcp
    - 15672/tcp
    - 50051/tcp
    - 9000/tcp

- name: Allow public services for all modes
  command:
    cmd: firewall-cmd --permanent --zone=public --add-service=ssh
  register: firewall_ssh
  changed_when: "'success' in firewall_ssh.stdout"

- name: Allow HTTP/HTTPS on admin and single nodes
  command:
    cmd: firewall-cmd --permanent --zone=public --add-service={{ item }}
  register: firewall_web
  changed_when: "'success' in firewall_web.stdout"
  loop:
    - http
    - https
  when: admiral_effective_host_profile in ['single-node', 'admin']

- name: Allow WireGuard UDP port on multinode profiles
  command:
    cmd: firewall-cmd --permanent --zone=public --add-port=51820/udp
  register: firewall_wg
  changed_when: "'success' in firewall_wg.stdout"
  when: admiral_effective_host_profile in ['admin', 'worker', 'portal']

- name: Remove managed egress direct rules (admin profile)
  command:
    cmd: firewall-cmd --permanent --direct --remove-rule ipv4 filter OUTPUT {{ item.priority }} {{ item.rule }}
  loop:
    - { priority: 10, rule: "-o lo -j ACCEPT" }
    - { priority: 20, rule: "-m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT" }
    - { priority: 30, rule: "-d 10.99.0.0/24 -j ACCEPT" }
    - { priority: 35, rule: "-p tcp --dport 22 -j ACCEPT" }
    - { priority: 40, rule: "-p tcp --dport 80 -j ACCEPT" }
    - { priority: 41, rule: "-p tcp --dport 443 -j ACCEPT" }
    - { priority: 42, rule: "-p udp --dport 53 -j ACCEPT" }
    - { priority: 43, rule: "-p tcp --dport 53 -j ACCEPT" }
    - { priority: 200, rule: "-j REJECT" }
  changed_when: false
  failed_when: false
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_effective_host_profile in ['single-node', 'admin']
    - not admiral_use_nftables_egress

- name: Remove managed egress direct rules (spoke profile)
  command:
    cmd: firewall-cmd --permanent --direct --remove-rule ipv4 filter OUTPUT {{ item.priority }} {{ item.rule }}
  loop:
    - { priority: 10, rule: "-o lo -j ACCEPT" }
    - { priority: 20, rule: "-m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT" }
    - { priority: 30, rule: "-d 10.99.0.0/24 -j ACCEPT" }
    - { priority: 35, rule: "-p tcp --dport 22 -j ACCEPT" }
    - { priority: 36, rule: "-p udp --dport 51820 -j ACCEPT" }
    - { priority: 200, rule: "-j REJECT" }
  changed_when: false
  failed_when: false
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_effective_host_profile in ['worker', 'portal']
    - not admiral_use_nftables_egress

- name: Apply egress controls for admin and single nodes
  command:
    cmd: firewall-cmd --permanent --direct --add-rule ipv4 filter OUTPUT {{ item.priority }} {{ item.rule }}
  register: firewall_egress_admin
  changed_when: "'success' in firewall_egress_admin.stdout"
  failed_when: false
  loop:
    - { priority: 10, rule: "-o lo -j ACCEPT" }
    - { priority: 20, rule: "-m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT" }
    - { priority: 30, rule: "-d 10.99.0.0/24 -j ACCEPT" }
    - { priority: 35, rule: "-p tcp --dport 22 -j ACCEPT" }
    - { priority: 40, rule: "-p tcp --dport 80 -j ACCEPT" }
    - { priority: 41, rule: "-p tcp --dport 443 -j ACCEPT" }
    - { priority: 42, rule: "-p udp --dport 53 -j ACCEPT" }
    - { priority: 43, rule: "-p tcp --dport 53 -j ACCEPT" }
    - { priority: 200, rule: "-j REJECT" }
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_effective_host_profile in ['single-node', 'admin']
    - not admiral_use_nftables_egress

- name: Apply egress controls for worker and portal spokes
  command:
    cmd: firewall-cmd --permanent --direct --add-rule ipv4 filter OUTPUT {{ item.priority }} {{ item.rule }}
  register: firewall_egress_spoke
  changed_when: "'success' in firewall_egress_spoke.stdout"
  failed_when: false
  loop:
    - { priority: 10, rule: "-o lo -j ACCEPT" }
    - { priority: 20, rule: "-m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT" }
    - { priority: 30, rule: "-d 10.99.0.0/24 -j ACCEPT" }
    - { priority: 35, rule: "-p tcp --dport 22 -j ACCEPT" }
    - { priority: 36, rule: "-p udp --dport 51820 -j ACCEPT" }
    - { priority: 200, rule: "-j REJECT" }
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_effective_host_profile in ['worker', 'portal']
    - not admiral_use_nftables_egress

- name: Allow dev mode services
  command:
    cmd: firewall-cmd --permanent --zone=public --add-service={{ item }}
  register: firewall_dev_services
  changed_when: "'success' in firewall_dev_services.stdout"
  loop:
    - cockpit
  when: admiral_dev_mode | default(false) | bool

- name: Allow dev mode ports
  command:
    cmd: firewall-cmd --permanent --zone=public --add-port={{ item }}
  register: firewall_dev_ports
  changed_when: "'success' in firewall_dev_ports.stdout"
  loop:
    - 5000/tcp
    - 5001/tcp
    - 40000-49999/tcp
  when: admiral_dev_mode | default(false) | bool

- name: Reload firewall to apply policy
  command:
    cmd: firewall-cmd --reload
  changed_when: false

- name: Apply dual-stack egress controls via nftables
  block:
    - name: Remove previous egress nftables table if present
      command: nft delete table inet admiral_egress
      failed_when: false

    - name: Ensure nftables configuration directory exists
      file:
        path: /etc/nftables
        state: directory
        mode: "0755"

    - name: Write egress nftables ruleset
      template:
        src: admiral-egress.nft.j2
        dest: /etc/nftables/admiral-egress.nft
        mode: 0644

    - name: Load egress nftables ruleset
      command: nft -f /etc/nftables/admiral-egress.nft

    - name: Write egress systemd oneshot service for boot persistence
      template:
        src: admiral-egress.service.j2
        dest: /etc/systemd/system/admiral-egress.service
        mode: 0644
      register: firewall_egress_unit

    - name: Enable egress boot service
      systemd:
        name: admiral-egress
        enabled: true
        daemon_reload: "{{ firewall_egress_unit.changed }}"
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_use_nftables_egress

- name: Remove secure egress policy in explicit dev mode
  block:
    - name: Delete active Admiral egress table in dev mode
      command: nft delete table inet admiral_egress
      failed_when: false
      changed_when: false

    - name: Disable persistent Admiral egress policy in dev mode
      systemd:
        name: admiral-egress
        enabled: false
        state: stopped
      failed_when: false
  when: admiral_dev_mode | default(false) | bool

- name: Verify effective public services
  command:
    cmd: firewall-cmd --zone=public --list-services
  register: firewall_public_services
  changed_when: false

- name: Verify effective public ports
  command:
    cmd: firewall-cmd --zone=public --list-ports
  register: firewall_public_ports
  changed_when: false

- name: Detect active admin services for portal-node validation
  command:
    cmd: systemctl is-active --quiet {{ item }}
  register: firewall_admin_service_state
  changed_when: false
  failed_when: false
  loop:
    - caddy
    - admirald
  when: admiral_install_mode == 'portal-node'

- name: Determine whether portal-node shares an admin host
  set_fact:
    firewall_portal_shares_admin_host: >-
      {{
        (
          firewall_admin_service_state.results
          | selectattr('item', 'equalto', 'caddy')
          | map(attribute='rc')
          | first
          | default(1)
        ) == 0 and
        (
          firewall_admin_service_state.results
          | selectattr('item', 'equalto', 'admirald')
          | map(attribute='rc')
          | first
          | default(1)
        ) == 0
      }}
  when: admiral_install_mode == 'portal-node'

- name: Assert only expected public services remain exposed (admin/single)
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh', 'http', 'https'] + (['cockpit'] if (admiral_dev_mode | default(false) | bool) else [])) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when: admiral_effective_host_profile in ['single-node', 'admin']

- name: Assert only ssh remains exposed (worker)
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh']) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when: admiral_effective_host_profile == 'worker'

- name: Assert admin ingress services remain exposed when portal-node shares the admin host
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh', 'http', 'https']) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when:
    - admiral_install_mode == 'portal-node'
    - firewall_portal_shares_admin_host | default(false) | bool

- name: Assert only ssh remains exposed on dedicated portal spokes
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh']) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when:
    - admiral_install_mode == 'portal-node'
    - not (firewall_portal_shares_admin_host | default(false) | bool)

- name: Assert only expected public ports remain exposed
  assert:
    that:
      - (firewall_public_ports.stdout.split() | difference((['51820/udp'] if admiral_effective_host_profile in ['admin', 'worker', 'portal'] else []) + (['5000/tcp', '5001/tcp', '40000-49999/tcp'] if (admiral_dev_mode | default(false) | bool) else [])) | length) == 0
    fail_msg: "Unexpected direct public firewalld ports remain enabled: {{ firewall_public_ports.stdout }}"

- name: Query egress direct rules (non-AlmaLinux)
  command:
    cmd: firewall-cmd --direct --get-all-rules
  register: firewall_direct_rules
  changed_when: false
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - not admiral_use_nftables_egress

- name: Query dual-stack egress nftables rules
  command:
    cmd: nft list chain inet admiral_egress output
  register: firewall_nft_rules
  changed_when: false
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_use_nftables_egress

- name: Assert managed egress reject rule is active (non-AlmaLinux)
  assert:
    that:
      - "'ipv4 filter OUTPUT 200 -j REJECT' in firewall_direct_rules.stdout"
    fail_msg: "Expected egress reject baseline was not applied in firewalld direct rules."
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - not admiral_use_nftables_egress

- name: Assert managed dual-stack egress reject rule is active
  assert:
    that:
      - "'reject' in firewall_nft_rules.stdout"
    fail_msg: "Expected egress reject baseline was not applied in nftables rules."
  when:
    - not (admiral_dev_mode | default(false) | bool)
    - admiral_use_nftables_egress
