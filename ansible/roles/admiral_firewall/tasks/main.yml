---
- name: Ensure firewalld is installed
  package:
    name: firewalld
    state: present

- name: Unmask firewalld service
  systemd:
    name: firewalld
    masked: false

- name: Ensure firewalld is enabled and running
  systemd:
    name: firewalld
    state: started
    enabled: true
    daemon_reload: true

- name: Set default firewalld zone to public
  command:
    cmd: firewall-cmd --set-default-zone=public
  register: firewall_default_zone
  until: firewall_default_zone.rc == 0
  retries: 5
  delay: 2
  changed_when: "'success' in firewall_default_zone.stdout"

- name: Ensure public zone target is default deny
  command:
    cmd: firewall-cmd --permanent --zone=public --set-target=default
  register: firewall_public_target
  changed_when: "'success' in firewall_public_target.stdout"

- name: Remove broad public services from public zone
  command:
    cmd: firewall-cmd --permanent --zone=public --remove-service={{ item }}
  register: firewall_removed_service
  changed_when: "'success' in firewall_removed_service.stdout"
  failed_when: false
  loop:
    - cockpit
    - dhcpv6-client
    - mdns

- name: Remove direct public Admiral ports from public zone
  command:
    cmd: firewall-cmd --permanent --zone=public --remove-port={{ item }}
  register: firewall_removed_port
  changed_when: "'success' in firewall_removed_port.stdout"
  failed_when: false
  loop:
    - 8080/tcp
    - 8443/tcp
    - 9099/tcp
    - 2019/tcp
    - 5000/tcp
    - 5001/tcp
    - 5432/tcp
    - 6379/tcp
    - 5671/tcp
    - 15672/tcp
    - 50051/tcp
    - 9000/tcp

- name: Allow public services for all modes
  command:
    cmd: firewall-cmd --permanent --zone=public --add-service=ssh
  register: firewall_ssh
  changed_when: "'success' in firewall_ssh.stdout"

- name: Allow HTTP/HTTPS on admin and single nodes
  command:
    cmd: firewall-cmd --permanent --zone=public --add-service={{ item }}
  register: firewall_web
  changed_when: "'success' in firewall_web.stdout"
  loop:
    - http
    - https
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Allow WireGuard UDP port on all modes
  command:
    cmd: firewall-cmd --permanent --zone=public --add-port=51820/udp
  register: firewall_wg
  changed_when: "'success' in firewall_wg.stdout"

- name: Allow dev mode services
  command:
    cmd: firewall-cmd --permanent --zone=public --add-service={{ item }}
  register: firewall_dev_services
  changed_when: "'success' in firewall_dev_services.stdout"
  loop:
    - cockpit
  when: admiral_dev_mode | default(false) | bool

- name: Allow dev mode ports
  command:
    cmd: firewall-cmd --permanent --zone=public --add-port={{ item }}
  register: firewall_dev_ports
  changed_when: "'success' in firewall_dev_ports.stdout"
  loop:
    - 5000/tcp
    - 5001/tcp
    - 40000-49999/tcp
  when: admiral_dev_mode | default(false) | bool

- name: Reload firewall to apply policy
  command:
    cmd: firewall-cmd --reload
  changed_when: false

- name: Verify effective public services
  command:
    cmd: firewall-cmd --zone=public --list-services
  register: firewall_public_services
  changed_when: false

- name: Verify effective public ports
  command:
    cmd: firewall-cmd --zone=public --list-ports
  register: firewall_public_ports
  changed_when: false

- name: Detect local admin packages for portal-node validation
  command:
    cmd: rpm -q {{ item }}
  register: firewall_admin_package_state
  changed_when: false
  failed_when: false
  loop:
    - caddy
    - admirald
  when: admiral_install_mode == 'portal-node'

- name: Determine whether portal-node shares an admin host
  set_fact:
    firewall_portal_shares_admin_host: >-
      {{
        (
          firewall_admin_package_state.results
          | selectattr('item', 'equalto', 'caddy')
          | map(attribute='rc')
          | first
          | default(1)
        ) == 0 and
        (
          firewall_admin_package_state.results
          | selectattr('item', 'equalto', 'admirald')
          | map(attribute='rc')
          | first
          | default(1)
        ) == 0
      }}
  when: admiral_install_mode == 'portal-node'

- name: Assert only expected public services remain exposed (admin/single)
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh', 'http', 'https'] + (['cockpit'] if (admiral_dev_mode | default(false) | bool) else [])) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Assert only ssh remains exposed (worker)
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh']) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when: admiral_install_mode == 'worker-node'

- name: Assert admin ingress services remain exposed when portal-node shares the admin host
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh', 'http', 'https']) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when:
    - admiral_install_mode == 'portal-node'
    - firewall_portal_shares_admin_host | default(false) | bool

- name: Assert only ssh remains exposed on dedicated portal spokes
  assert:
    that:
      - (firewall_public_services.stdout.split() | difference(['ssh']) | length) == 0
    fail_msg: "Unexpected public firewalld services remain enabled: {{ firewall_public_services.stdout }}"
  when:
    - admiral_install_mode == 'portal-node'
    - not (firewall_portal_shares_admin_host | default(false) | bool)

- name: Assert only expected public ports remain exposed
  assert:
    that:
      - (firewall_public_ports.stdout.split() | difference(['51820/udp'] + (['5000/tcp', '5001/tcp', '40000-49999/tcp'] if (admiral_dev_mode | default(false) | bool) else [])) | length) == 0
    fail_msg: "Unexpected direct public firewalld ports remain enabled: {{ firewall_public_ports.stdout }}"
