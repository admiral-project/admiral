---
- name: Install Caddy and admiralctl
  dnf:
    name:
      - caddy
      - admirald
      - admiralctl
    state: present

- name: Ensure Caddy is enabled and running
  systemd:
    name: caddy
    enabled: true
    state: started

- name: Deploy admirald INI configuration
  copy:
    dest: /etc/admirald.ini
    content: |
      # Admiral Control Plane
      # Generated by Ansible

      port = {{ admirald_port | default('8080') }}
      listen_address = {{ admirald_listen_address | default('0.0.0.0' if (fleet_public_ip is defined and fleet_public_ip != '' and fleet_public_ip != '127.0.0.1') else '127.0.0.1') }}
      database_url = {{ admirald_database_url | default('postgres://admiral:' ~ admiral_postgres_password ~ '@127.0.0.1:5432/admiral?sslmode=require') }}
      queue_database_url = {{ admirald_queue_database_url | default('postgres://admiral:' ~ admiral_postgres_password ~ '@127.0.0.1:5432/admiral_queue?sslmode=require') }}
      admin_token = {{ admirald_admin_token | default(admiral_admin_token_value) }}
      token_pepper = {{ admirald_token_pepper | default(admiral_token_pepper_value) }}
      secrets_key = {{ admirald_secrets_key | default(admiral_secrets_key_value) }}
      signing_key = {{ admirald_signing_key | default(admiral_ed25519_private_key_value) }}
      task_encryption_key = {{ admirald_task_encryption_key | default(admiral_task_encryption_key_value) }}
      flagship_admin_user = {{ admirald_flagship_admin_user | default(admiral_flagship_bootstrap_user) }}
      flagship_admin_pswd = {{ admirald_flagship_admin_pswd | default(admiral_flagship_bootstrap_password) }}
      tls_cert_file = {{ admirald_tls_cert | default('/etc/admiral/tls/admirald.pem') }}
      tls_key_file = {{ admirald_tls_key | default('/etc/admiral/tls/admirald-key.pem') }}
      networking_admin_target = {{ admirald_networking_admin_target | default('') }}
      networking_flagship_target = {{ admirald_networking_flagship_target | default('https://127.0.0.1:5000') }}
      networking_portal_target = {{ admirald_networking_portal_target | default('https://127.0.0.1:5001') }}
      networking_cockpit_target = {{ admirald_networking_cockpit_target | default('http://127.0.0.1:9090') }}
      caddy_admin_url = {{ admirald_caddy_admin_url | default('http://127.0.0.1:2019') }}
    mode: "0640"
    owner: root
    group: admiral
  no_log: true

- name: Set ADMIRAL_ENV=development in dev mode
  copy:
    dest: /etc/systemd/system/admirald.service.d/dev-mode.conf
    content: |
      [Service]
      Environment=ADMIRAL_ENV=development
    mode: "0644"
  when: admiral_dev_mode | default(false) | bool

- name: Enable and start admirald
  systemd:
    name: admirald
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure admiralctl config directory exists
  file:
    path: /root/.config/admiralctl
    state: directory
    mode: "0700"

- name: Deploy admiralctl configuration
  copy:
    dest: /root/.config/admiralctl/config.yaml
    mode: "0600"
    content: |
      server_url: {{ admiralctl_server_url | default('https://127.0.0.1:8080') }}
      token: {{ admirald_admin_token | default(admiral_admin_token_value) }}
      ca_cert_file: {{ admiralctl_ca_cert_file | default('/etc/admiral/tls/ca.pem') }}
  no_log: true
