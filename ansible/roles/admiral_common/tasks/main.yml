---
# Node roles are mutually exclusive per host. A worker node (admiral-fleet)
# and a portal node (admiral-harbor) cannot coexist on the same server.
# --single-node is the only mode that combines all roles on one host.

- name: Install dnf-plugins-core (for copr)
  dnf:
    name: dnf-plugins-core
    state: present

- name: Enable EPEL repository
  dnf:
    name: epel-release
    state: present
  when: ansible_distribution in ['RedHat', 'CentOS', 'Rocky', 'AlmaLinux']

- name: Enable Caddy COPR repository
  command:
    cmd: dnf copr enable -y @caddy/caddy
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:group_caddy:caddy.repo

- name: Enable Admiral COPR repository
  command:
    cmd: dnf copr enable -y admiral-project/admiral
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:admiral-project:admiral.repo

- name: Refresh package metadata after enabling repositories
  dnf:
    update_cache: true

- name: Install admiral-common baseline package
  dnf:
    name:
      - admiral-common
    state: present

- name: Install admin-plane packages
  dnf:
    name:
      - admiralctl
      - caddy
    state: present
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Install managed Caddyfile for Admiral
  copy:
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    content: |
      {
        admin 127.0.0.1:2019
      }
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Ensure sshd drop-in directory exists
  file:
    path: /etc/ssh/sshd_config.d
    state: directory
    mode: "0755"

- name: Deploy Admiral SSH hardening baseline
  copy:
    dest: /etc/ssh/sshd_config.d/50-admiral-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      MaxAuthTries 3
      LoginGraceTime 30
  register: admiral_sshd_hardening

- name: Reload sshd after hardening update
  systemd:
    name: sshd
    state: reloaded
  when: admiral_sshd_hardening.changed

- name: Install PostgreSQL server utilities
  dnf:
    name: postgresql-server
    state: present
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Ensure Admiral configuration and TLS directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: root
    group: admiral
  loop:
    - /etc/admiral
    - /etc/admiral/tls

- name: Manage secrets inventory (admin/single-node only)
  when: >-
    admiral_install_mode in ['single-node', 'admin-node'] or
    (admiral_install_mode == 'portal-node' and (admiral_portal_shares_admin_host | default(false) | bool))
  block:
    - name: Check whether Admiral secret inventory already exists
      stat:
        path: /etc/admiral/secrets
      register: admiral_secrets_file

    - name: Read existing Admiral secret inventory
      slurp:
        src: /etc/admiral/secrets
      register: admiral_secrets_slurp
      when: admiral_secrets_file.stat.exists
      no_log: true

    - name: Decode existing Admiral secret inventory
      set_fact:
        admiral_secrets_text: "{{ admiral_secrets_slurp.content | b64decode }}"
      when: admiral_secrets_file.stat.exists
      no_log: true

    - name: Initialize empty Admiral secret inventory text
      set_fact:
        admiral_secrets_text: ""
      when: not admiral_secrets_file.stat.exists
      no_log: true

    - name: Extract existing Admiral secrets
      set_fact:
        admiral_existing_postgres_password: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_POSTGRES_PASSWORD=(.*)$') | first | default('') }}"
        admiral_existing_admin_token: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_ADMIN_TOKEN=(.*)$') | first | default('') }}"
        admiral_existing_token_pepper: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_TOKEN_PEPPER=(.*)$') | first | default('') }}"
        admiral_existing_secrets_key: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_SECRETS_KEY=(.*)$') | first | default('') }}"
        admiral_existing_flagship_secret_key: "{{ admiral_secrets_text | regex_findall('(?m)^FLAGSHIP_SECRET_KEY=(.*)$') | first | default('') }}"
        admiral_existing_flagship_bootstrap_user: "{{ admiral_secrets_text | regex_findall('(?m)^FLAGSHIP_BOOTSTRAP_USER=(.*)$') | first | default('') }}"
        admiral_existing_flagship_bootstrap_password: "{{ admiral_secrets_text | regex_findall('(?m)^FLAGSHIP_BOOTSTRAP_PASSWORD=(.*)$') | first | default('') }}"
        admiral_existing_harbor_secret_key: "{{ admiral_secrets_text | regex_findall('(?m)^HARBOR_SECRET_KEY=(.*)$') | first | default('') }}"
        admiral_existing_harbor_encryption_key: "{{ admiral_secrets_text | regex_findall('(?m)^HARBOR_ENCRYPTION_KEY=(.*)$') | first | default('') }}"
        admiral_existing_harbor_bootstrap_user: "{{ admiral_secrets_text | regex_findall('(?m)^HARBOR_BOOTSTRAP_USER=(.*)$') | first | default('') }}"
        admiral_existing_harbor_bootstrap_password: "{{ admiral_secrets_text | regex_findall('(?m)^HARBOR_BOOTSTRAP_PASSWORD=(.*)$') | first | default('') }}"
        admiral_existing_harbor_legacy_admin_password: "{{ admiral_secrets_text | regex_findall('(?m)^HARBOR_LEGACY_ADMIN_PASSWORD=(.*)$') | first | default('') }}"
        admiral_existing_harbor_api_token: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_HARBOR_API_TOKEN=(.*)$') | first | default('') }}"
        admiral_existing_cockpit_admin_user: "{{ admiral_secrets_text | regex_findall('(?m)^COCKPIT_ADMIN_USER=(.*)$') | first | default('') }}"
        admiral_existing_cockpit_admin_password: "{{ admiral_secrets_text | regex_findall('(?m)^COCKPIT_ADMIN_PASSWORD=(.*)$') | first | default('') }}"
        admiral_existing_fleet_token: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_FLEET_TOKEN=(.*)$') | first | default('') }}"
        admiral_existing_ed25519_private_key: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_ED25519_PRIVATE_KEY=(.*)$') | first | default('') }}"
        admiral_existing_task_public_key: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_TASK_PUBLIC_KEY=(.*)$') | first | default('') }}"
        admiral_existing_task_encryption_key: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_TASK_ENCRYPTION_KEY=(.*)$') | first | default('') }}"
        admiral_existing_session_hmac_key: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_SESSION_HMAC_KEY=(.*)$') | first | default('') }}"
        admiral_existing_ssh_admin_user: "{{ admiral_secrets_text | regex_findall('(?m)^ADMIRAL_SSH_USER=(.*)$') | first | default('') }}"
      no_log: true

    - name: Generate Admiral PostgreSQL password
      shell:
        cmd: openssl rand -base64 36 | tr '+/' '-_' | tr -d '='
      register: admiral_postgres_password_generated
      when: admiral_existing_postgres_password == ''
      changed_when: true
      no_log: true

    - name: Generate Admiral admin token
      command:
        cmd: openssl rand -hex 32
      register: admiral_admin_token_generated
      when: admiral_existing_admin_token == ''
      changed_when: true
      no_log: true

    - name: Generate Admiral token pepper
      command:
        cmd: openssl rand -hex 32
      register: admiral_token_pepper_generated
      when: admiral_existing_token_pepper == ''
      changed_when: true
      no_log: true

    - name: Generate Admiral secrets key
      command:
        cmd: openssl rand -hex 32
      register: admiral_secrets_key_generated
      when: admiral_existing_secrets_key == ''
      changed_when: true
      no_log: true

    - name: Generate Flagship secret key
      command:
        cmd: openssl rand -hex 32
      register: admiral_flagship_secret_key_generated
      when: admiral_existing_flagship_secret_key == ''
      changed_when: true
      no_log: true

    - name: Generate Flagship bootstrap username suffix
      command:
        cmd: openssl rand -hex 5
      register: admiral_flagship_bootstrap_user_generated
      when: admiral_existing_flagship_bootstrap_user == ''
      changed_when: true
      no_log: true

    - name: Generate Flagship bootstrap password
      command:
        cmd: openssl rand -base64 24
      register: admiral_flagship_bootstrap_password_generated
      when: admiral_existing_flagship_bootstrap_password == ''
      changed_when: true
      no_log: true

    - name: Generate Harbor secret key
      command:
        cmd: openssl rand -hex 32
      register: admiral_harbor_secret_key_generated
      when: admiral_existing_harbor_secret_key == ''
      changed_when: true
      no_log: true

    - name: Generate Harbor encryption key
      command:
        cmd: openssl rand -hex 32
      register: admiral_harbor_encryption_key_generated
      when: admiral_existing_harbor_encryption_key == ''
      changed_when: true
      no_log: true

    - name: Generate Harbor bootstrap username suffix
      command:
        cmd: openssl rand -hex 5
      register: admiral_harbor_bootstrap_user_generated
      when: admiral_existing_harbor_bootstrap_user == ''
      changed_when: true
      no_log: true

    - name: Generate Harbor bootstrap password
      command:
        cmd: openssl rand -base64 24
      register: admiral_harbor_bootstrap_password_generated
      when: admiral_existing_harbor_bootstrap_password == ''
      changed_when: true
      no_log: true

    - name: Generate Harbor legacy admin rotation password
      command:
        cmd: openssl rand -base64 24
      register: admiral_harbor_legacy_admin_password_generated
      when: admiral_existing_harbor_legacy_admin_password == ''
      changed_when: true
      no_log: true

    - name: Generate Harbor API token (scoped, not admin-level)
      command:
        cmd: openssl rand -hex 32
      register: admiral_harbor_api_token_generated
      when: admiral_existing_harbor_api_token == ''
      changed_when: true
      no_log: true

    - name: Generate Cockpit admin username suffix
      command:
        cmd: openssl rand -hex 5
      register: admiral_cockpit_admin_user_generated
      when: admiral_existing_cockpit_admin_user == ''
      changed_when: true
      no_log: true

    - name: Generate Cockpit admin password
      command:
        cmd: openssl rand -base64 24
      register: admiral_cockpit_admin_password_generated
      when: admiral_existing_cockpit_admin_password == ''
      changed_when: true
      no_log: true

    - name: Generate Admiral fleet token
      command:
        cmd: openssl rand -hex 32
      register: admiral_fleet_token_generated
      when: admiral_existing_fleet_token == ''
      changed_when: true
      no_log: true

    - name: Generate Ed25519 signing key pair (admin only)
      command:
        cmd: /usr/bin/admiralctl init --generate-signing-key
      register: admiral_ed25519_key_generated
      when:
        - admiral_install_mode in ['single-node', 'admin-node']
        - admiral_existing_ed25519_private_key == ''
      changed_when: true
      no_log: true

    - name: Parse generated Ed25519 keys
      set_fact:
        admiral_ed25519_private_key_generated: "{{ (admiral_ed25519_key_generated.stdout | default('') ~ '\n' ~ admiral_ed25519_key_generated.stderr | default('')) | regex_search('private_key:([a-f0-9]+)', '\\1') | first | default('') }}"
        admiral_task_public_key_generated: "{{ (admiral_ed25519_key_generated.stdout | default('') ~ '\n' ~ admiral_ed25519_key_generated.stderr | default('')) | regex_search('public_key:([a-f0-9]+)', '\\1') | first | default('') }}"
      when:
        - admiral_install_mode in ['single-node', 'admin-node']
        - admiral_ed25519_key_generated.changed | default(false)
      no_log: true

    - name: Generate task encryption key (shared AES-256-GCM key)
      command:
        cmd: openssl rand -hex 32
      register: admiral_task_encryption_key_generated
      when: admiral_existing_task_encryption_key == ''
      changed_when: true
      no_log: true

    - name: Generate Admiral SSH admin username
      command:
        cmd: openssl rand -hex 5
      register: admiral_ssh_admin_user_generated
      when: admiral_existing_ssh_admin_user == ''
      changed_when: true
      no_log: true

    - name: Generate persistent session HMAC key
      command:
        cmd: openssl rand -hex 32
      register: admiral_session_hmac_key_generated
      when: admiral_existing_session_hmac_key == ''
      changed_when: true
      no_log: true

    - name: Consolidate Admiral installation secrets
      set_fact:
        admiral_postgres_password: "{{ admiral_existing_postgres_password if admiral_existing_postgres_password != '' else (admiral_postgres_password_generated.stdout | default('')) }}"
        admiral_admin_token_value: "{{ admiral_existing_admin_token if admiral_existing_admin_token != '' else (admiral_admin_token_generated.stdout | default('')) }}"
        admiral_token_pepper_value: "{{ admiral_existing_token_pepper if admiral_existing_token_pepper != '' else (admiral_token_pepper_generated.stdout | default('')) }}"
        admiral_secrets_key_value: "{{ admiral_existing_secrets_key if admiral_existing_secrets_key != '' else (admiral_secrets_key_generated.stdout | default('')) }}"
        admiral_flagship_secret_key_value: "{{ admiral_existing_flagship_secret_key if admiral_existing_flagship_secret_key != '' else (admiral_flagship_secret_key_generated.stdout | default('')) }}"
        admiral_flagship_bootstrap_user: "{{ admiral_existing_flagship_bootstrap_user if admiral_existing_flagship_bootstrap_user != '' else ('opsf_' ~ (admiral_flagship_bootstrap_user_generated.stdout | default(''))) }}"
        admiral_flagship_bootstrap_password: "{{ admiral_existing_flagship_bootstrap_password if admiral_existing_flagship_bootstrap_password != '' else (admiral_flagship_bootstrap_password_generated.stdout | default('')) }}"
        admiral_harbor_secret_key_value: "{{ admiral_existing_harbor_secret_key if admiral_existing_harbor_secret_key != '' else (admiral_harbor_secret_key_generated.stdout | default('')) }}"
        admiral_harbor_encryption_key_value: "{{ admiral_existing_harbor_encryption_key if admiral_existing_harbor_encryption_key != '' else (admiral_harbor_encryption_key_generated.stdout | default('')) }}"
        admiral_harbor_bootstrap_user: "{{ admiral_existing_harbor_bootstrap_user if admiral_existing_harbor_bootstrap_user != '' else ('opsh_' ~ (admiral_harbor_bootstrap_user_generated.stdout | default(''))) }}"
        admiral_harbor_bootstrap_password: "{{ admiral_existing_harbor_bootstrap_password if admiral_existing_harbor_bootstrap_password != '' else (admiral_harbor_bootstrap_password_generated.stdout | default('')) }}"
        admiral_harbor_legacy_admin_password: "{{ admiral_existing_harbor_legacy_admin_password if admiral_existing_harbor_legacy_admin_password != '' else (admiral_harbor_legacy_admin_password_generated.stdout | default('')) }}"
        admiral_harbor_api_token_value: "{{ admiral_existing_harbor_api_token if admiral_existing_harbor_api_token != '' else (admiral_harbor_api_token_generated.stdout | default('')) }}"
        admiral_cockpit_admin_user: "{{ admiral_existing_cockpit_admin_user if admiral_existing_cockpit_admin_user != '' else ('opsc_' ~ (admiral_cockpit_admin_user_generated.stdout | default(''))) }}"
        admiral_cockpit_admin_password: "{{ admiral_existing_cockpit_admin_password if admiral_existing_cockpit_admin_password != '' else (admiral_cockpit_admin_password_generated.stdout | default('')) }}"
        admiral_fleet_token_value: "{{ admiral_existing_fleet_token if admiral_existing_fleet_token != '' else (admiral_fleet_token_generated.stdout | default('')) }}"
        admiral_ed25519_private_key_value: "{{ admiral_existing_ed25519_private_key if admiral_existing_ed25519_private_key != '' else (admiral_ed25519_private_key_generated | default('')) }}"
        admiral_task_public_key_value: "{{ admiral_existing_task_public_key if admiral_existing_task_public_key != '' else (admiral_task_public_key_generated | default('')) }}"
        admiral_task_encryption_key_value: "{{ admiral_existing_task_encryption_key if admiral_existing_task_encryption_key != '' else (admiral_task_encryption_key_generated.stdout | default('')) }}"
        admiral_session_hmac_key_value: "{{ admiral_existing_session_hmac_key if admiral_existing_session_hmac_key != '' else (admiral_session_hmac_key_generated.stdout | default('')) }}"
        admiral_ssh_admin_user: "{{ admiral_existing_ssh_admin_user if admiral_existing_ssh_admin_user != '' else ('opsa_' ~ (admiral_ssh_admin_user_generated.stdout | default(''))) }}"
      no_log: true

    - name: Persist bootstrap secret inventory
      copy:
        dest: /etc/admiral/secrets
        mode: "0600"
        owner: root
        group: root
        content: |
          # Admiral bootstrap secret inventory.
          # Back up this file securely.
          # CRITICAL: HARBOR_ENCRYPTION_KEY protects Harbor encrypted data stored in PostgreSQL.
          # This includes PayPal client_secret and LMS API keys.
          # Losing this key invalidates stored PayPal credentials — you will need to
          # re-enter them through the Harbor admin UI.
          # CRITICAL: ADMIRAL_SECRETS_KEY protects admirald-encrypted secret material.
          ADMIRAL_POSTGRES_USER=admiral
          ADMIRAL_POSTGRES_PASSWORD={{ admiral_postgres_password }}
          ADMIRAL_ADMIN_TOKEN={{ admiral_admin_token_value }}
          ADMIRAL_TOKEN_PEPPER={{ admiral_token_pepper_value }}
          ADMIRAL_SECRETS_KEY={{ admiral_secrets_key_value }}
          FLAGSHIP_SECRET_KEY={{ admiral_flagship_secret_key_value }}
          FLAGSHIP_BOOTSTRAP_USER={{ admiral_flagship_bootstrap_user }}
          FLAGSHIP_BOOTSTRAP_PASSWORD={{ admiral_flagship_bootstrap_password }}
          HARBOR_SECRET_KEY={{ admiral_harbor_secret_key_value }}
          HARBOR_ENCRYPTION_KEY={{ admiral_harbor_encryption_key_value }}
          HARBOR_BOOTSTRAP_USER={{ admiral_harbor_bootstrap_user }}
          HARBOR_BOOTSTRAP_PASSWORD={{ admiral_harbor_bootstrap_password }}
          HARBOR_LEGACY_ADMIN_PASSWORD={{ admiral_harbor_legacy_admin_password }}
          ADMIRAL_HARBOR_API_TOKEN={{ admiral_harbor_api_token_value }}
          COCKPIT_ADMIN_USER={{ admiral_cockpit_admin_user }}
          COCKPIT_ADMIN_PASSWORD={{ admiral_cockpit_admin_password }}
          ADMIRAL_FLEET_TOKEN={{ admiral_fleet_token_value }}
          ADMIRAL_ED25519_PRIVATE_KEY={{ admiral_ed25519_private_key_value }}
          ADMIRAL_TASK_PUBLIC_KEY={{ admiral_task_public_key_value }}
          ADMIRAL_TASK_ENCRYPTION_KEY={{ admiral_task_encryption_key_value }}
          ADMIRAL_SESSION_HMAC_KEY={{ admiral_session_hmac_key_value }}
          ADMIRAL_SSH_USER={{ admiral_ssh_admin_user }}
      no_log: true

- name: Remove secrets file from non-admin nodes (safety cleanup)
  file:
    path: /etc/admiral/secrets
    state: absent
  when:
    - admiral_install_mode in ['worker-node', 'portal-node']
    - not (admiral_portal_shares_admin_host | default(false) | bool)

- name: Manage dedicated portal-local PostgreSQL credential
  when:
    - admiral_install_mode == 'portal-node'
    - not (admiral_portal_shares_admin_host | default(false) | bool)
  block:
    - name: Read existing Harbor environment for database credential
      slurp:
        src: /etc/admiral/harbor.env
      register: admiral_existing_harbor_env
      failed_when: false
      no_log: true

    - name: Extract existing portal PostgreSQL credential
      set_fact:
        admiral_existing_portal_postgres_password: >-
          {{ (admiral_existing_harbor_env.content | default('') | b64decode
              | regex_search('(?m)^HARBOR_DATABASE_URL=postgresql://admiral_portal:([^@]+)@', '\1')
              | first | default('')) }}
      no_log: true

    - name: Generate portal-local PostgreSQL credential
      command: openssl rand -hex 32
      register: admiral_portal_postgres_password_generated
      when: admiral_existing_portal_postgres_password == ''
      changed_when: true
      no_log: true

    - name: Set dedicated portal PostgreSQL identity
      set_fact:
        admiral_postgres_user: admiral_portal
        admiral_postgres_password: >-
          {{ admiral_existing_portal_postgres_password
             if admiral_existing_portal_postgres_password != ''
             else (admiral_portal_postgres_password_generated.stdout | trim) }}
      no_log: true

- name: Create Admiral SSH admin user
  user:
    name: "{{ admiral_ssh_admin_user }}"
    shell: /bin/bash
    groups: wheel
    append: true
    create_home: true
  when: admiral_install_mode in ['single-node', 'admin-node', 'worker-node', 'portal-node']

- name: Configure NOPASSWD sudo for SSH admin user
  copy:
    dest: "/etc/sudoers.d/{{ admiral_ssh_admin_user }}"
    content: "{{ admiral_ssh_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"
  when: admiral_install_mode in ['single-node', 'admin-node', 'worker-node', 'portal-node']

- name: Deploy SSH public key to admin user
  authorized_key:
    user: "{{ admiral_ssh_admin_user }}"
    key: "{{ admiral_ssh_pub_key }}"
    state: present
  when:
    - admiral_install_mode in ['single-node', 'admin-node', 'worker-node', 'portal-node']
    - admiral_ssh_pub_key is defined
    - admiral_ssh_pub_key | length > 0

- name: Determine TLS SAN string including public IP and WireGuard IP
  set_fact:
    admiral_tls_san: >-
      {%- set san = 'DNS:localhost,IP:127.0.0.1' -%}
      {%- if fleet_public_ip is defined and fleet_public_ip != '' and fleet_public_ip != '127.0.0.1' -%}
      {%-   set san = san ~ ',IP:' ~ fleet_public_ip -%}
      {%- endif -%}
      {%- if admiral_wireguard_ip is defined and admiral_wireguard_ip != '' -%}
      {%-   set san = san ~ ',IP:' ~ admiral_wireguard_ip -%}
      {%- endif -%}
      {{ san }}
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Detect active admin services for portal-node TLS cleanup
  command:
    cmd: systemctl is-active --quiet {{ item }}
  register: admiral_common_admin_service_state
  changed_when: false
  failed_when: false
  loop:
    - caddy
    - admirald
  when: admiral_install_mode == 'portal-node'

- name: Determine whether portal-node shares an admin host for TLS cleanup
  set_fact:
    admiral_portal_shares_admin_host: >-
      {{
        (
          admiral_common_admin_service_state.results
          | selectattr('item', 'equalto', 'caddy')
          | map(attribute='rc')
          | first
          | default(1)
        ) == 0 and
        (
          admiral_common_admin_service_state.results
          | selectattr('item', 'equalto', 'admirald')
          | map(attribute='rc')
          | first
          | default(1)
        ) == 0
      }}
  when: admiral_install_mode == 'portal-node'

- name: Generate self-signed CA certificate on hub nodes
  command:
    cmd: >
      bash -c 'umask 077 && exec openssl req -x509 -nodes -days 3650 -newkey rsa:4096
      -keyout /etc/admiral/tls/ca-key.pem
      -out /etc/admiral/tls/ca.pem
      -subj "/CN=Admiral CA"'
    creates: /etc/admiral/tls/ca.pem
  when: admiral_wireguard_role == 'hub'

- name: Generate admirald server key
  command:
    cmd: >
      bash -c 'umask 077 && exec openssl genrsa -out /etc/admiral/tls/admirald-key.pem 2048'
    creates: /etc/admiral/tls/admirald-key.pem
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Generate admirald CSR with dynamic SAN
  command:
    cmd: >
      openssl req -new -key /etc/admiral/tls/admirald-key.pem
      -out /etc/admiral/tls/admirald.csr
      -subj "/CN=localhost"
      -addext "subjectAltName={{ admiral_tls_san }}"
    creates: /etc/admiral/tls/admirald.csr
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Write openssl extensions file for SAN
  copy:
    dest: /etc/admiral/tls/admirald-ext.cnf
    content: |
      subjectAltName={{ admiral_tls_san }}
    mode: "0640"
    owner: admiral
    group: admiral
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Sign admirald certificate with CA on hub nodes
  command:
    cmd: >
      openssl x509 -req -days 730
      -in /etc/admiral/tls/admirald.csr
      -CA /etc/admiral/tls/ca.pem
      -CAkey /etc/admiral/tls/ca-key.pem
      -CAcreateserial
      -out /etc/admiral/tls/admirald.pem
      -extfile /etc/admiral/tls/admirald-ext.cnf
  when: admiral_wireguard_role == 'hub'

- name: Read portal-node CSR for controller-side signing
  slurp:
    src: /etc/admiral/tls/admirald.csr
  register: admiral_portal_tls_csr
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Create temporary CSR file on controller for portal-node
  tempfile:
    state: file
    prefix: admiral-portal-
    suffix: .csr
  register: admiral_portal_tls_csr_tmp
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Create temporary extensions file on controller for portal-node
  tempfile:
    state: file
    prefix: admiral-portal-
    suffix: .ext
  register: admiral_portal_tls_ext_tmp
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Create temporary certificate file on controller for portal-node
  tempfile:
    state: file
    prefix: admiral-portal-
    suffix: .pem
  register: admiral_portal_tls_cert_tmp
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Write portal-node CSR to controller temporary file
  copy:
    dest: "{{ admiral_portal_tls_csr_tmp.path }}"
    content: "{{ admiral_portal_tls_csr.content | b64decode }}"
    mode: "0600"
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Write portal-node SAN extensions to controller temporary file
  copy:
    dest: "{{ admiral_portal_tls_ext_tmp.path }}"
    content: |
      subjectAltName={{ admiral_tls_san }}
    mode: "0600"
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Sign portal-node certificate on controller
  command:
    cmd: >
      openssl x509 -req -days 730
      -in {{ admiral_portal_tls_csr_tmp.path }}
      -CA /etc/admiral/tls/ca.pem
      -CAkey /etc/admiral/tls/ca-key.pem
      -CAcreateserial
      -out {{ admiral_portal_tls_cert_tmp.path }}
      -extfile {{ admiral_portal_tls_ext_tmp.path }}
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Read signed portal-node certificate from controller
  slurp:
    src: "{{ admiral_portal_tls_cert_tmp.path }}"
  register: admiral_portal_tls_cert
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Deploy signed portal-node certificate
  copy:
    dest: /etc/admiral/tls/admirald.pem
    content: "{{ admiral_portal_tls_cert.content | b64decode }}"
    mode: "0640"
    owner: root
    group: admiral
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Remove temporary openssl extensions file
  file:
    path: /etc/admiral/tls/admirald-ext.cnf
    state: absent
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Remove CSR after signing
  file:
    path: /etc/admiral/tls/admirald.csr
    state: absent
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Remove CA private key from spoke nodes after cert generation
  file:
    path: /etc/admiral/tls/ca-key.pem
    state: absent
  when:
    - admiral_install_mode in ['worker-node', 'portal-node']
    - admiral_wireguard_role == 'spoke'
    - not (admiral_portal_shares_admin_host | default(false) | bool)

- name: Remove temporary portal-node signing files from controller
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ admiral_portal_tls_csr_tmp.path }}"
    - "{{ admiral_portal_tls_ext_tmp.path }}"
    - "{{ admiral_portal_tls_cert_tmp.path }}"
  delegate_to: localhost
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_wireguard_role == 'spoke'

- name: Set TLS cert permissions
  file:
    path: "{{ item }}"
    mode: "0640"
    owner: root
    group: admiral
  loop:
    - /etc/admiral/tls/admirald.pem
    - /etc/admiral/tls/admirald-key.pem
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Set CA certificate permissions
  file:
    path: /etc/admiral/tls/ca.pem
    mode: "0644"
    owner: root
    group: root
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Set CA private key permissions
  file:
    path: /etc/admiral/tls/ca-key.pem
    mode: "0600"
    owner: root
    group: root
  when:
    - admiral_wireguard_role == 'hub'

- name: Ensure admirald.pem exists for dev mode
  command:
    cmd: >
      bash -c 'umask 077 && exec openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/admiral/tls/admirald-key.pem
      -out /etc/admiral/tls/admirald.pem
      -subj "/CN=localhost"'
    creates: /etc/admiral/tls/admirald.pem
  when: admiral_dev_mode | default(false) | bool

- name: Set permissions on dev mode certificates
  file:
    path: "{{ item }}"
    mode: "0640"
    owner: root
    group: admiral
  loop:
    - /etc/admiral/tls/admirald.pem
    - /etc/admiral/tls/admirald-key.pem
  when: admiral_dev_mode | default(false) | bool

- name: Ensure PostgreSQL runtime directory exists
  file:
    path: /run/postgresql
    state: directory
    mode: "0755"
    owner: postgres
    group: postgres
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Initialize PostgreSQL database cluster
  command:
    cmd: postgresql-setup --initdb
    creates: /var/lib/pgsql/data/PG_VERSION
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Include WireGuard subnet in PostgreSQL listen_addresses for multi-node
  set_fact:
    admiral_pg_listen_addresses: "127.0.0.1"
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Update PostgreSQL listen_addresses
  lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ admiral_pg_listen_addresses | default('127.0.0.1') }}'"
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Require password authentication for localhost PostgreSQL
  lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: "^host\\s+all\\s+all\\s+127\\.0\\.0\\.1/32\\s+"
    line: "host    all             all             127.0.0.1/32            scram-sha-256"
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Require password authentication for localhost PostgreSQL over IPv6
  lineinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: "^host\\s+all\\s+all\\s+::1/128\\s+"
    line: "host    all             all             ::1/128                 scram-sha-256"
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Copy TLS certificates for PostgreSQL SSL
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    mode: "{{ item.mode }}"
    owner: postgres
    group: postgres
  loop:
    - { src: "/etc/admiral/tls/ca.pem", dest: "/var/lib/pgsql/data/ca.crt", mode: "0600" }
    - { src: "/etc/admiral/tls/admirald.pem", dest: "/var/lib/pgsql/data/server.crt", mode: "0600" }
    - { src: "/etc/admiral/tls/admirald-key.pem", dest: "/var/lib/pgsql/data/server.key", mode: "0600" }
  when:
    - admiral_install_mode in ['single-node', 'admin-node']
    - admiral_wireguard_role == 'hub'

- name: Enable SSL in PostgreSQL configuration
  lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: "^#?{{ item.param | regex_escape }}\\s*="
    line: "{{ item.param }} = '{{ item.value }}'"
  loop:
    - { param: "ssl", value: "on" }
    - { param: "ssl_ca_file", value: "ca.crt" }
    - { param: "ssl_cert_file", value: "server.crt" }
    - { param: "ssl_key_file", value: "server.key" }
  when:
    - admiral_install_mode in ['single-node', 'admin-node']
    - admiral_wireguard_role == 'hub'

- name: Ensure PostgreSQL is enabled and restarted (applies pg_hba and SSL changes)
  systemd:
    name: postgresql
    enabled: true
    state: restarted
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Ensure Admiral PostgreSQL role exists with generated password
  become: false
  ansible.builtin.shell:
    cmd: |
      sudo -u postgres psql -c "SELECT 1 FROM pg_roles WHERE rolname = '{{ admiral_postgres_user | default('admiral') }}'" | grep -q 1 && \
        sudo -u postgres psql -c "ALTER ROLE {{ admiral_postgres_user | default('admiral') }} WITH LOGIN PASSWORD '{{ admiral_postgres_password }}'" || \
        sudo -u postgres psql -c "CREATE ROLE {{ admiral_postgres_user | default('admiral') }} LOGIN PASSWORD '{{ admiral_postgres_password }}'"
  changed_when: false
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']

- name: Ensure Admiral PostgreSQL databases exist (admin/single only)
  # Using shell/psql rather than community.postgresql modules to avoid
  # requiring the collection on the control node.
  become: false
  ansible.builtin.shell:
    cmd: |
      sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='{{ item }}'" | grep -q 1 || \
      sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE {{ item }} OWNER {{ admiral_postgres_user | default('admiral') }}"
  loop:
    - admiral
    - admiral_queue
  changed_when: false
  when: admiral_install_mode in ['single-node', 'admin-node']

- name: Ensure Harbor PostgreSQL database exists when Harbor is enabled
  become: false
  ansible.builtin.shell:
    cmd: |
      sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='admiral_harbor'" | grep -q 1 || \
      sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE admiral_harbor OWNER {{ admiral_postgres_user | default('admiral') }}"
  when: admiral_install_mode in ['single-node', 'admin-node', 'portal-node']
  changed_when: false
