---
- name: Install cockpit
  dnf:
    name: cockpit
    state: present

- name: Ensure cockpit.socket override directory exists
  file:
    path: /etc/systemd/system/cockpit.socket.d
    state: directory
    mode: "0755"

- name: Bind cockpit.socket to loopback only
  copy:
    dest: /etc/systemd/system/cockpit.socket.d/override.conf
    mode: "0644"
    content: |
      [Socket]
      ListenStream=
      ListenStream={{ '0.0.0.0:9090' if (admiral_dev_mode | default(false) | bool) else '127.0.0.1:9090' }}

- name: Ensure cockpit configuration directory exists
  file:
    path: /etc/cockpit
    state: directory
    mode: "0755"

- name: Configure Cockpit for reverse proxy
  copy:
    dest: /etc/cockpit/cockpit.conf
    mode: "0644"
    content: |
      [WebService]
      ProtocolHeader = X-Forwarded-Proto
      Origins = https://{{ admirald_networking_cockpit_host | default('') }} http://127.0.0.1:9090
  when: admirald_networking_cockpit_host is defined and admirald_networking_cockpit_host | length > 0

- name: Configure Cockpit for reverse proxy (fallback)
  copy:
    dest: /etc/cockpit/cockpit.conf
    mode: "0644"
    content: |
      [WebService]
      ProtocolHeader = X-Forwarded-Proto
  when: admirald_networking_cockpit_host is not defined or admirald_networking_cockpit_host | length == 0

- name: Enable and start cockpit.socket
  systemd:
    name: cockpit.socket
    enabled: true
    state: restarted
    daemon_reload: true

- name: Generate Cockpit password hash without process argument exposure
  command:
    cmd: openssl passwd -6 -stdin
    stdin: "{{ admiral_cockpit_admin_password }}"
    stdin_add_newline: true
  register: cockpit_password_hash
  changed_when: false
  no_log: true

- name: Create Cockpit admin system user
  user:
    name: "{{ admiral_cockpit_admin_user }}"
    password: "{{ cockpit_password_hash.stdout }}"
    shell: /bin/bash
    create_home: true
    state: present
  no_log: true
