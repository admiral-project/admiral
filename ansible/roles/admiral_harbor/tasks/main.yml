---
# Harbor runs on --single-node and on dedicated --portal-node spoke hosts.
# A remote spoke host cannot run both harbor and fleet. --single-node is the
# only supported mode that combines worker and portal roles on one machine.

- name: Check for Admirald-managed known host inventory
  stat:
    path: /var/lib/admiral/know_host.yaml
  register: admiral_known_hosts_file
  when: admiral_install_mode == 'portal-node'

- name: Read Admirald-managed known host inventory
  slurp:
    src: /var/lib/admiral/know_host.yaml
  register: admiral_known_hosts_slurp
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_known_hosts_file.stat.exists

- name: Decode Admirald-managed known host inventory
  set_fact:
    admiral_known_hosts_inventory: "{{ admiral_known_hosts_slurp.content | b64decode | from_yaml }}"
  when:
    - admiral_install_mode == 'portal-node'
    - admiral_known_hosts_file.stat.exists

- name: Resolve effective harbor node id
  set_fact:
    harbor_node_id_effective: >-
      {{
        (ansible_hostname ~ '-portal')
        if admiral_install_mode == 'single-node'
        else (
          fleet_node_id
          | default((admiral_known_hosts_inventory.next.portal.node_id | default('')), true)
          | default(ansible_hostname)
        )
      }}

- name: Set harbor API URL for portal-node
  set_fact:
    admiral_api_url_for_harbor: "https://{{ admiral_admin_wireguard_ip | default(admiral_admin_endpoint | default('10.99.0.1')) }}:8080"
  when: admiral_install_mode == 'portal-node'

- name: Determine whether portal-node shares the admin host
  set_fact:
    harbor_portal_shares_admin_host: "{{ admiral_portal_shares_admin_host | default(false) | bool }}"
  when: admiral_install_mode == 'portal-node'

- name: Determine admiral-harbor bind address
  set_fact:
    harbor_bind_address: >-
      {{
        '0.0.0.0'
        if (admiral_dev_mode | default(false) | bool)
        else (
          '127.0.0.1'
          if admiral_install_mode == 'single-node' or (harbor_portal_shares_admin_host | default(false) | bool)
          else (admiral_wireguard_ip | default(''))
        )
      }}

- name: Determine admiral-harbor route target
  set_fact:
    harbor_route_target: "https://{{ '127.0.0.1' if harbor_bind_address in ['0.0.0.0', '127.0.0.1'] else harbor_bind_address }}:5001"

- name: Require WireGuard bind address for dedicated portal nodes
  assert:
    that:
      - harbor_bind_address is defined
      - harbor_bind_address | length > 0
    fail_msg: "Dedicated portal-node installs require admiral_wireguard_ip so Harbor can bind to the VPN address."
  when:
    - admiral_install_mode == 'portal-node'
    - not (harbor_portal_shares_admin_host | default(false) | bool)
    - not (admiral_dev_mode | default(false) | bool)

- name: Check for existing Harbor node token
  slurp:
    src: /etc/admiral/harbor.env
  register: harbor_existing_env
  failed_when: false
  no_log: true

- name: Extract existing Harbor node token
  set_fact:
    harbor_existing_node_token: >-
      {{ (harbor_existing_env.content | default('') | b64decode
          | regex_findall('(?m)^HARBOR_NODE_TOKEN=(.*)$') | first | default('')) }}
  no_log: true

- name: Generate random Harbor node token
  set_fact:
    harbor_node_token_value: "{{ harbor_existing_node_token if harbor_existing_node_token else lookup('ansible.builtin.pipe', 'openssl rand -hex 32') }}"
  no_log: true

- name: Install admiral-harbor
  dnf:
    name: admiral-harbor
    state: present

- name: Deploy admiral-harbor environment
  copy:
    dest: /etc/admiral/harbor.env
    content: |
      HARBOR_SECRET_KEY={{ admiral_harbor_secret_key_value }}
      HARBOR_UPLOAD_DIR=/var/lib/admiral/harbor/uploads
      HARBOR_BOOTSTRAP_ADMIN_USER={{ admiral_harbor_bootstrap_user }}
      HARBOR_BOOTSTRAP_ADMIN_PASSWORD={{ admiral_harbor_bootstrap_password }}
      HARBOR_BOOTSTRAP_ADMIN_DISPLAY_NAME=Harbor Bootstrap Admin
      HARBOR_MAX_BACKUP_UPLOAD_BYTES=536870912
      HARBOR_ENCRYPTION_KEY={{ admiral_harbor_encryption_key_value }}
      HARBOR_DATABASE_URL=postgresql://{{ admiral_postgres_user | default('admiral') }}:{{ admiral_postgres_password }}@127.0.0.1:5432/admiral_harbor?sslmode=disable
      HARBOR_NODE_ID={{ harbor_node_id_effective }}
      HARBOR_NODE_TOKEN={{ harbor_node_token_value }}
      ADMIRAL_API_URL={{ admiral_api_url_for_harbor | default(admiral_control_plane_url) }}
      HARBOR_PAYPAL_CLIENT_ID=
      HARBOR_PAYPAL_CLIENT_SECRET=
      HARBOR_PAYPAL_WEBHOOK_ID=
      HARBOR_PAYPAL_BASE_URL=https://api-m.sandbox.paypal.com
      HARBOR_PAYPAL_MODE={{ 'sandbox' if not (admiral_dev_mode | default(false) | bool) else 'mock' }}
      HARBOR_PAYPAL_RETURN_URL=https://{{ admiral_harbor_external_host | default('portal.localhost.invalid') }}/billing/return
      HARBOR_PAYPAL_CANCEL_URL=https://{{ admiral_harbor_external_host | default('portal.localhost.invalid') }}/billing/cancel
      HARBOR_SMTP_FROM=noreply@example.com
      HARBOR_EXTERNAL_URL=https://{{ admiral_harbor_external_host | default('portal.localhost.invalid') }}
      HARBOR_OVERDUE_POLICY_VERSION=overdue-policy-v1
      HARBOR_OVERDUE_SUSPEND_AFTER_DAYS=5
      HARBOR_OVERDUE_DEPROVISION_AFTER_DAYS=10
      HARBOR_OVERDUE_LAST_BACKUP_RETENTION_DAYS=15
      ADMIRAL_HARBOR_API_TOKEN={{ admiral_harbor_api_token_value }}
      ADMIRAL_CA_FILE={{ '' if (admiral_dev_mode | default(false) | bool) else '/etc/admiral/tls/ca.pem' }}
      ADMIRAL_INSECURE_SKIP_VERIFY={{ '1' if (admiral_dev_mode | default(false) | bool) else '0' }}
    mode: "0600"
    owner: root
    group: admiral
  no_log: true
  notify: restart admiral-harbor

- name: Check if admiral-harbor SMTP environment exists
  stat:
    path: /etc/admiral/harbor.smtp.env
  register: harbor_smtp_env

- name: Deploy admiral-harbor SMTP environment
  copy:
    dest: /etc/admiral/harbor.smtp.env
    content: |
      HARBOR_SMTP_HOST=
      HARBOR_SMTP_PORT=587
      HARBOR_SMTP_USERNAME=
      HARBOR_SMTP_PASSWORD=
      HARBOR_SMTP_USE_TLS=1
      HARBOR_SMTP_USE_SSL=0
      HARBOR_EMAIL_CONFIRMATION_TTL_HOURS=72
    mode: "0600"
    owner: root
    group: admiral
  no_log: true
  when: not harbor_smtp_env.stat.exists

- name: Ensure admiral-harbor systemd override directory exists
  file:
    path: /etc/systemd/system/admiral-harbor.service.d
    state: directory
    mode: "0755"

- name: Deploy admiral-harbor systemd binding override
  copy:
    dest: /etc/systemd/system/admiral-harbor.service.d/override.conf
    content: |
      [Service]
      ExecStart=
      ExecStart=/usr/bin/harbor-gunicorn --workers 2 --bind {{ harbor_bind_address }}:5001 --certfile /etc/admiral/tls/admirald.pem --keyfile /etc/admiral/tls/admirald-key.pem run:app
      Environment=ENV={{ 'development' if (admiral_dev_mode | default(false) | bool) else 'production' }}
    mode: "0644"
  register: harbor_systemd_override

- name: Enable and start admiral-harbor
  systemd:
    name: admiral-harbor
    enabled: true
    state: "{{ 'restarted' if harbor_systemd_override.changed else 'started' }}"
    daemon_reload: true

- name: Enable and start admiral-harbor worker timer
  systemd:
    name: admiral-harbor-worker.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start admiral-harbor catalog sync timer
  systemd:
    name: admiral-harbor-catalog-sync.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Register portal node with admirald
  command: >
    /usr/bin/admiralctl nodes register
    --id "{{ harbor_node_id_effective }}"
    --hostname "{{ ansible_fqdn }}"
    --ip "{{ ansible_default_ipv4.address }}"
    --wireguard-ip "{{ admiral_wireguard_ip | default('') }}"
    --public-ip "{{ fleet_public_ip | default('') }}"
    --role portal
    --token "{{ harbor_node_token_value }}"
    --os "{{ ansible_distribution ~ ' ' ~ ansible_distribution_version }}"
  delegate_to: localhost
  environment:
    ADMIRAL_ADMIN_TOKEN: "{{ admiral_admin_token_value }}"
    ADMIRAL_SERVER_URL: "{{ admiral_control_plane_url }}"
    ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
  no_log: true

- name: Ensure admirald systemd override directory exists on admin host
  file:
    path: /etc/systemd/system/admirald.service.d
    state: directory
    mode: "0755"
  delegate_to: localhost
  when: admiral_install_mode == 'portal-node'

- name: Configure admin portal route target for this portal node
  copy:
    dest: /etc/systemd/system/admirald.service.d/20-portal-target.conf
    content: |
      [Service]
      Environment=ADMIRAL_NETWORKING_PORTAL_TARGET={{ harbor_route_target }}
    mode: "0644"
  delegate_to: localhost
  when: admiral_install_mode == 'portal-node'

- name: Restart admirald after portal route target change
  systemd:
    name: admirald
    state: restarted
    daemon_reload: true
  delegate_to: localhost
  when: admiral_install_mode == 'portal-node'

- name: Wait for admirald after portal route target change
  wait_for:
    host: "{{ admiral_control_plane_host }}"
    port: 8080
    timeout: 30
  delegate_to: localhost
  when: admiral_install_mode == 'portal-node'

- name: Synchronize public routes after portal registration
  command:
    cmd: /usr/bin/admiralctl routes sync
  delegate_to: localhost
  changed_when: false
  environment:
    ADMIRAL_ADMIN_TOKEN: "{{ admiral_admin_token_value }}"
    ADMIRAL_SERVER_URL: "{{ admiral_control_plane_url }}"
    ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
  when: admiral_install_mode == 'portal-node'

- name: Remind operator to configure SMTP
  debug:
    msg: >-
      Admiral Harbor SMTP is provisioned in /etc/admiral/harbor.smtp.env.
      Update it with the real SMTP host, credentials, and transport settings
      before relying on email confirmation in production.

- name: Read Harbor user inventory
  command:
    cmd: harborctl user list --output json
  register: harbor_user_inventory
  changed_when: false
  no_log: true

- name: Parse Harbor admin inventory
  set_fact:
    harbor_admin_users: "{{ (harbor_user_inventory.stdout | from_json).admins }}"
  no_log: true

- name: Create generated Harbor bootstrap admin user
  command:
    cmd: harborctl user create --type admin {{ admiral_harbor_bootstrap_user }}
  environment:
    ADMIRAL_HARBOR_SET_PASSWORD: "{{ admiral_harbor_bootstrap_password }}"
  when: admiral_harbor_bootstrap_user not in (harbor_admin_users | map(attribute='username') | list)
  no_log: true

- name: Rotate legacy Harbor default admin password
  command:
    cmd: harborctl user set-password admin
  environment:
    ADMIRAL_HARBOR_SET_PASSWORD: "{{ admiral_harbor_legacy_admin_password }}"
  when: "'admin' in (harbor_admin_users | map(attribute='username') | list)"
  no_log: true

- name: Refresh Harbor user inventory after bootstrap changes
  command:
    cmd: harborctl user list --output json
  register: harbor_user_inventory_after_bootstrap
  changed_when: false
  no_log: true

- name: Parse refreshed Harbor admin inventory
  set_fact:
    harbor_admin_users_after_bootstrap: "{{ (harbor_user_inventory_after_bootstrap.stdout | from_json).admins }}"
  no_log: true

- name: Deactivate legacy Harbor default admin user
  command:
    cmd: harborctl user toggle-active admin
  when:
    - "'admin' in (harbor_admin_users_after_bootstrap | map(attribute='username') | list)"
    - (harbor_admin_users_after_bootstrap
       | selectattr('username', 'equalto', 'admin')
       | map(attribute='is_active')
       | first
       | default(false))
    - (harbor_admin_users_after_bootstrap
       | rejectattr('username', 'equalto', 'admin')
       | selectattr('is_active')
       | list
       | length) > 0
  no_log: true
