---
- name: Set harbor API URL for portal-node
  set_fact:
    admiral_api_url_for_harbor: "https://{{ admiral_admin_wireguard_ip | default(admiral_admin_endpoint | default('10.99.0.1')) }}:8080"
  when: admiral_install_mode == 'portal-node'

- name: Install admiral-harbor
  dnf:
    name: admiral-harbor
    state: present

- name: Deploy admiral-harbor environment
  copy:
    dest: /etc/admiral/harbor.env
    content: |
      HARBOR_SECRET_KEY={{ admiral_harbor_secret_key_value }}
      HARBOR_UPLOAD_DIR=/var/lib/admiral/harbor/uploads
      HARBOR_BOOTSTRAP_ADMIN_USER={{ admiral_harbor_bootstrap_user }}
      HARBOR_BOOTSTRAP_ADMIN_PASSWORD={{ admiral_harbor_bootstrap_password }}
      HARBOR_BOOTSTRAP_ADMIN_DISPLAY_NAME=Harbor Bootstrap Admin
      HARBOR_MAX_BACKUP_UPLOAD_BYTES=536870912
      HARBOR_ENCRYPTION_KEY={{ admiral_harbor_encryption_key_value }}
      HARBOR_DATABASE_URL=postgresql://admiral:{{ admiral_postgres_password }}@127.0.0.1:5432/admiral_harbor?sslmode=disable
      ADMIRAL_API_URL={{ admiral_api_url_for_harbor | default('https://127.0.0.1:8080') }}
      HARBOR_PAYPAL_CLIENT_ID=
      HARBOR_PAYPAL_CLIENT_SECRET=
      HARBOR_PAYPAL_WEBHOOK_ID=
      HARBOR_PAYPAL_BASE_URL=https://api-m.sandbox.paypal.com
      HARBOR_PAYPAL_MODE=mock
      HARBOR_PAYPAL_RETURN_URL=https://{{ admiral_harbor_external_host | default('portal.localhost.invalid') }}/billing/return
      HARBOR_PAYPAL_CANCEL_URL=https://{{ admiral_harbor_external_host | default('portal.localhost.invalid') }}/billing/cancel
      HARBOR_SMTP_FROM=noreply@example.com
      HARBOR_EXTERNAL_URL=https://{{ admiral_harbor_external_host | default('portal.localhost.invalid') }}
      HARBOR_OVERDUE_POLICY_VERSION=overdue-policy-v1
      HARBOR_OVERDUE_SUSPEND_AFTER_DAYS=5
      HARBOR_OVERDUE_DEPROVISION_AFTER_DAYS=10
      HARBOR_OVERDUE_LAST_BACKUP_RETENTION_DAYS=15
      ADMIRAL_SHARED_TOKEN={{ admiral_shared_token_value }}
      ADMIRAL_CA_FILE=/etc/admiral/tls/ca.pem
      ADMIRAL_INSECURE_SKIP_VERIFY=0
    mode: "0640"
    owner: root
    group: admiral
  no_log: true

- name: Check if admiral-harbor SMTP environment exists
  stat:
    path: /etc/admiral/harbor.smtp.env
  register: harbor_smtp_env

- name: Deploy admiral-harbor SMTP environment
  copy:
    dest: /etc/admiral/harbor.smtp.env
    content: |
      HARBOR_SMTP_HOST=
      HARBOR_SMTP_PORT=587
      HARBOR_SMTP_USERNAME=
      HARBOR_SMTP_PASSWORD=
      HARBOR_SMTP_USE_TLS=1
      HARBOR_SMTP_USE_SSL=0
      HARBOR_EMAIL_CONFIRMATION_TTL_HOURS=72
    mode: "0640"
    owner: root
    group: admiral
  no_log: true
  when: not harbor_smtp_env.stat.exists

- name: Remove legacy admiral-harbor systemd override
  file:
    path: /etc/systemd/system/admiral-harbor.service.d
    state: absent

- name: Enable and start admiral-harbor
  systemd:
    name: admiral-harbor
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start admiral-harbor worker timer
  systemd:
    name: admiral-harbor-worker.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start admiral-harbor catalog sync timer
  systemd:
    name: admiral-harbor-catalog-sync.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Remind operator to configure SMTP
  debug:
    msg: >-
      Admiral Harbor SMTP is provisioned in /etc/admiral/harbor.smtp.env.
      Update it with the real SMTP host, credentials, and transport settings
      before relying on email confirmation in production.

- name: Read Harbor user inventory
  command:
    cmd: harborctl user list --output json
  register: harbor_user_inventory
  changed_when: false
  no_log: true

- name: Parse Harbor admin inventory
  set_fact:
    harbor_admin_users: "{{ (harbor_user_inventory.stdout | from_json).admins }}"
  no_log: true

- name: Create generated Harbor bootstrap admin user
  command:
    cmd: harborctl user create --type admin {{ admiral_harbor_bootstrap_user }}
  environment:
    ADMIRAL_HARBOR_SET_PASSWORD: "{{ admiral_harbor_bootstrap_password }}"
  when: admiral_harbor_bootstrap_user not in (harbor_admin_users | map(attribute='username') | list)
  no_log: true

- name: Rotate legacy Harbor default admin password
  command:
    cmd: harborctl user set-password admin
  environment:
    ADMIRAL_HARBOR_SET_PASSWORD: "{{ admiral_harbor_legacy_admin_password }}"
  when: "'admin' in (harbor_admin_users | map(attribute='username') | list)"
  no_log: true

- name: Refresh Harbor user inventory after bootstrap changes
  command:
    cmd: harborctl user list --output json
  register: harbor_user_inventory_after_bootstrap
  changed_when: false
  no_log: true

- name: Parse refreshed Harbor admin inventory
  set_fact:
    harbor_admin_users_after_bootstrap: "{{ (harbor_user_inventory_after_bootstrap.stdout | from_json).admins }}"
  no_log: true

- name: Deactivate legacy Harbor default admin user
  command:
    cmd: harborctl user toggle-active admin
  when:
    - "'admin' in (harbor_admin_users_after_bootstrap | map(attribute='username') | list)"
    - (harbor_admin_users_after_bootstrap
       | selectattr('username', 'equalto', 'admin')
       | map(attribute='is_active')
       | first
       | default(false))
    - (harbor_admin_users_after_bootstrap
       | rejectattr('username', 'equalto', 'admin')
       | selectattr('is_active')
       | list
       | length) > 0
  no_log: true
