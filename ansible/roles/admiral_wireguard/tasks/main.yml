---
- name: Install wireguard-tools
  dnf:
    name: wireguard-tools
    state: present

- name: Generate WireGuard private key
  shell:
    cmd: |
      umask 077
      wg genkey > /etc/wireguard/admiral.key
      chmod 0400 /etc/wireguard/admiral.key
    creates: /etc/wireguard/admiral.key
  no_log: true

- name: Read WireGuard private key
  slurp:
    src: /etc/wireguard/admiral.key
  register: admiral_wg_private_key_slurp
  no_log: true

- name: Set WireGuard private key fact
  set_fact:
    admiral_wg_private_key:
      stdout: "{{ admiral_wg_private_key_slurp.content | b64decode | trim }}"
  no_log: true

- name: Derive WireGuard public key
  shell:
    cmd: cat /etc/wireguard/admiral.key | wg pubkey
  register: admiral_wg_public_key
  changed_when: false
  no_log: true

- name: Store WireGuard public key for peer exchange (hub only)
  copy:
    content: "{{ admiral_wg_public_key.stdout }}\n"
    dest: /etc/wireguard/admiral.pub
    mode: "0644"
  when: admiral_wireguard_role == 'hub'

- name: Create peers directory on hub
  file:
    path: /etc/wireguard/peers.d
    state: directory
    mode: "0700"
  when: admiral_wireguard_role == 'hub'

- name: Set WireGuard listen port
  set_fact:
    admiral_wireguard_port: "{{ admiral_wireguard_port | default('51820') }}"

- name: Check for Admirald-managed known host inventory
  stat:
    path: /var/lib/admiral/know_host.yaml
  register: admiral_known_hosts_file

- name: Read Admirald-managed known host inventory
  slurp:
    src: /var/lib/admiral/know_host.yaml
  register: admiral_known_hosts_slurp
  when: admiral_known_hosts_file.stat.exists

- name: Decode Admirald-managed known host inventory
  set_fact:
    admiral_known_hosts_inventory: "{{ admiral_known_hosts_slurp.content | b64decode | from_yaml }}"
  when: admiral_known_hosts_file.stat.exists

- name: Determine known host inventory lookup key
  set_fact:
    admiral_known_host_lookup_key: "{{ fleet_node_id | default(fleet_node_id_effective | default(ansible_hostname)) }}"
  when: admiral_known_hosts_file.stat.exists

- name: Resolve current node entry from Admirald-managed inventory
  set_fact:
    admiral_known_host_entry: >-
      {{
        (
          (admiral_known_hosts_inventory.nodes | default({})).get(admiral_known_host_lookup_key, {})
        )
      }}
  when: admiral_known_hosts_file.stat.exists

# Worker and portal nodes use separate IP pools from the known host inventory.
# This enforces the design constraint that the two roles cannot share a host.
- name: Resolve next bootstrap assignment from known host inventory
  set_fact:
    admiral_known_host_next_assignment: >-
      {{
        admiral_known_hosts_inventory.next.portal
        if admiral_install_mode == 'portal-node'
        else admiral_known_hosts_inventory.next.worker
      }}
  when: admiral_known_hosts_file.stat.exists

- name: Require explicit or inventory-derived WireGuard IP for spoke nodes
  assert:
    that:
      - admiral_wireguard_role == 'hub' or (admiral_known_host_entry.wireguard_ip | default('')) != '' or (admiral_known_host_next_assignment.wireguard_ip | default('')) != ''
    fail_msg: "Spoke nodes require a wireguard_ip entry or next assignment in /var/lib/admiral/know_host.yaml."
  when:
    - admiral_wireguard_ip is not defined

- name: Determine WireGuard IP address for this node
  set_fact:
    admiral_wireguard_ip: >-
      {{
        admiral_wireguard_ip
        | default(
            '10.99.0.1' if admiral_wireguard_role == 'hub'
            else (
              (admiral_known_host_entry.wireguard_ip | default('')) if (admiral_known_host_entry.wireguard_ip | default('')) != ''
              else (admiral_known_host_next_assignment.wireguard_ip | default(''))
            )
          )
      }}

- name: Check for an existing hub WireGuard configuration
  stat:
    path: /etc/wireguard/wg-admiral.conf
  register: admiral_existing_wireguard_config_file
  when: admiral_wireguard_role == 'hub'

- name: Read existing hub WireGuard configuration
  slurp:
    src: /etc/wireguard/wg-admiral.conf
  register: admiral_existing_wireguard_config
  when:
    - admiral_wireguard_role == 'hub'
    - admiral_existing_wireguard_config_file.stat.exists
  no_log: true

- name: Extract existing hub WireGuard peers
  set_fact:
    admiral_existing_wireguard_peers: >-
      {{
        (admiral_existing_wireguard_config.content | b64decode)
        | regex_findall('(?ms)^\\[Peer\\]\\s*\\n.*?(?=^\\[Peer\\]|\\Z)')
      }}
  when:
    - admiral_wireguard_role == 'hub'
    - admiral_existing_wireguard_config_file.stat.exists
    - admiral_existing_wireguard_config is defined
  no_log: true

- name: Find durable WireGuard peer fragments on hub
  find:
    paths: /etc/wireguard/peers.d
    patterns: "*.conf"
    file_type: file
  register: admiral_existing_wireguard_peer_files
  when: admiral_wireguard_role == 'hub'

- name: Read durable WireGuard peer fragments on hub
  slurp:
    src: "{{ item.path }}"
  loop: "{{ admiral_existing_wireguard_peer_files.files | default([]) }}"
  register: admiral_existing_wireguard_peer_slurps
  when: admiral_wireguard_role == 'hub'
  no_log: true

- name: Collect durable WireGuard peer fragments
  set_fact:
    admiral_existing_wireguard_peer_fragments: >-
      {{ (admiral_existing_wireguard_peer_slurps.results | default([]))
         | map(attribute='content') | map('b64decode') | list }}
  when: admiral_wireguard_role == 'hub'
  no_log: true

- name: Disable inter-node IP forwarding
  sysctl:
    name: "{{ item }}"
    value: '0'
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Read hub WireGuard public key from file for spoke nodes
  slurp:
    src: /etc/wireguard/admiral.pub
  register: admiral_wireguard_hub_pub_slurp
  when:
    - admiral_wireguard_role == 'spoke'
    - admiral_wireguard_hub_public_key is not defined

- name: Set hub public key fact for spoke
  set_fact:
    admiral_wireguard_hub_public_key: "{{ admiral_wireguard_hub_pub_slurp.content | b64decode | trim }}"
  when:
    - admiral_wireguard_role == 'spoke'
    - admiral_wireguard_hub_public_key is not defined
    - admiral_wireguard_hub_pub_slurp is defined
    - admiral_wireguard_hub_pub_slurp.content is defined

- name: Deploy WireGuard configuration
  template:
    src: wg-admiral.conf.j2
    dest: /etc/wireguard/wg-admiral.conf
    mode: "0600"
  no_log: true
  notify: restart wireguard

- name: Enable and start WireGuard
  systemd:
    name: wg-quick@wg-admiral
    enabled: true
    state: started
    daemon_reload: true

- name: Query permanent firewalld zones
  command:
    cmd: firewall-cmd --permanent --get-zones
  register: firewall_permanent_zones
  changed_when: false

- name: Create restricted Admiral WireGuard firewalld zone
  command:
    cmd: firewall-cmd --permanent --new-zone=admiral
  register: firewall_admiral_zone
  when: "'admiral' not in firewall_permanent_zones.stdout.split()"
  changed_when: true

- name: Set restricted Admiral zone target
  command:
    cmd: firewall-cmd --permanent --zone=admiral --set-target=DROP
  register: firewall_admiral_target
  changed_when: false

- name: Remove WireGuard interface from trusted zone
  command:
    cmd: firewall-cmd --permanent --zone=trusted --remove-interface=wg-admiral
  register: firewall_wg_untrusted
  changed_when: "'success' in firewall_wg_untrusted.stdout"
  failed_when: false

- name: Assign WireGuard interface to restricted Admiral zone
  command:
    cmd: firewall-cmd --permanent --zone=admiral --change-interface=wg-admiral
  register: firewall_wg_admiral
  changed_when: "'success' in firewall_wg_admiral.stdout"

- name: Permit admin API from WireGuard peers on admin hosts
  command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=admiral
      - >-
        --add-rich-rule=rule family="ipv4" source address="10.99.0.0/24"
        port port="8080" protocol="tcp" accept
  when: admiral_effective_host_profile == 'admin'
  register: firewall_admiral_admin_rule
  changed_when: "'ALREADY_ENABLED' not in firewall_admiral_admin_rule.stderr"

- name: Permit admin-to-worker Fleet and workload traffic
  command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=admiral
      - >-
        --add-rich-rule=rule family="ipv4" source address="10.99.0.1"
        port port="{{ item }}" protocol="tcp" accept
  loop:
    - 9099
    - 40000-49999
  when: admiral_effective_host_profile == 'worker'
  register: firewall_admiral_worker_rules
  changed_when: "'ALREADY_ENABLED' not in firewall_admiral_worker_rules.stderr"

- name: Permit admin-to-portal traffic
  command:
    argv:
      - firewall-cmd
      - --permanent
      - --zone=admiral
      - >-
        --add-rich-rule=rule family="ipv4" source address="10.99.0.1"
        port port="5001" protocol="tcp" accept
  when: admiral_effective_host_profile == 'portal'
  register: firewall_admiral_portal_rule
  changed_when: "'ALREADY_ENABLED' not in firewall_admiral_portal_rule.stderr"

- name: Reload firewall to apply zone changes
  command:
    cmd: firewall-cmd --reload
  when: >-
    firewall_wg_admiral.changed or
    firewall_wg_untrusted.changed or
    firewall_admiral_zone.changed | default(false) or
    firewall_admiral_target.changed or
    firewall_admiral_admin_rule.changed | default(false) or
    firewall_admiral_worker_rules.changed | default(false) or
    firewall_admiral_portal_rule.changed | default(false)
