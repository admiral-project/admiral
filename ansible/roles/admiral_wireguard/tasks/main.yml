---
- name: Install wireguard-tools
  dnf:
    name: wireguard-tools
    state: present

- name: Create WireGuard configuration directory
  file:
    path: /etc/wireguard
    state: directory
    mode: "0700"

- name: Generate WireGuard private key
  shell:
    cmd: |
      if [ ! -f /etc/wireguard/admiral.key ]; then
        wg genkey > /etc/wireguard/admiral.key
        chmod 0400 /etc/wireguard/admiral.key
      fi
      cat /etc/wireguard/admiral.key
  register: admiral_wg_private_key
  changed_when: false
  no_log: true

- name: Derive WireGuard public key
  shell:
    cmd: cat /etc/wireguard/admiral.key | wg pubkey
  register: admiral_wg_public_key
  changed_when: false
  no_log: true

- name: Store WireGuard public key for peer exchange
  copy:
    content: "{{ admiral_wg_public_key.stdout }}\n"
    dest: /etc/wireguard/admiral.pub
    mode: "0644"

- name: Create peers directory on hub
  file:
    path: /etc/wireguard/peers.d
    state: directory
    mode: "0755"
  when: admiral_wireguard_role == 'hub'

- name: Set WireGuard listen port
  set_fact:
    admiral_wireguard_port: "{{ admiral_wireguard_port | default('51820') }}"

- name: Derive WireGuard node index from node id
  set_fact:
    admiral_wireguard_node_index: "{{ fleet_node_id | default(ansible_hostname) | regex_findall('([0-9]+)$') | first | default('') }}"
  when: admiral_wireguard_ip is not defined

- name: Require explicit or derivable WireGuard IP for spoke nodes
  assert:
    that:
      - admiral_wireguard_role == 'hub' or (admiral_wireguard_node_index | default('')) != '' or admiral_install_mode == 'portal-node'
    fail_msg: "Spoke nodes require --wireguard-ip or a node id / hostname ending in digits to derive a stable overlay IP."
  when: admiral_wireguard_ip is not defined

- name: Determine WireGuard IP address for this node
  set_fact:
    admiral_wireguard_ip: >-
      {{
        admiral_wireguard_ip
        | default(
            '10.99.0.1' if admiral_wireguard_role == 'hub'
            else (
              '10.99.0.100' if admiral_install_mode == 'portal-node'
              else '10.99.0.' ~ ((admiral_wireguard_node_index | int) + 1)
            )
          )
      }}

- name: Enable IP forwarding on hub nodes
  sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: admiral_wireguard_role == 'hub'

- name: Deploy WireGuard configuration
  template:
    src: wg-admiral.conf.j2
    dest: /etc/wireguard/wg-admiral.conf
    mode: "0600"
  notify: restart wireguard

- name: Enable and start WireGuard
  systemd:
    name: wg-quick@wg-admiral
    enabled: true
    state: started
    daemon_reload: true
