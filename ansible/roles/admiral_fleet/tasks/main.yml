---
# Fleet runs on --single-node and on dedicated --worker-node spoke hosts.
# A remote spoke host cannot run both fleet and harbor. --single-node is the
# only supported mode that combines worker and portal roles on one machine.

- name: Resolve rootless Podman capacity settings from Ansible or controller environment
  set_fact:
    admiral_userns_size_effective: >-
      {{ (admiral_userns_size | string)
         if admiral_userns_size is defined and admiral_userns_size is not none and (admiral_userns_size | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_USERNS_SIZE') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_USERNS_SIZE') | string | length) > 0
               else admiral_userns_size_default) }}
    admiral_subid_count_effective: >-
      {{ (admiral_subid_count | string)
         if admiral_subid_count is defined and admiral_subid_count is not none and (admiral_subid_count | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_SUBID_COUNT') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_SUBID_COUNT') | string | length) > 0
               else admiral_subid_count_default) }}
    admiral_podman_num_locks_effective: >-
      {{ (admiral_podman_num_locks | string)
         if admiral_podman_num_locks is defined and admiral_podman_num_locks is not none and (admiral_podman_num_locks | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_PODMAN_NUM_LOCKS') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_PODMAN_NUM_LOCKS') | string | length) > 0
               else admiral_podman_num_locks_default) }}
    admiral_max_user_namespaces_effective: >-
      {{ (admiral_max_user_namespaces | string)
         if admiral_max_user_namespaces is defined and admiral_max_user_namespaces is not none and (admiral_max_user_namespaces | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_MAX_USER_NAMESPACES') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_MAX_USER_NAMESPACES') | string | length) > 0
               else admiral_max_user_namespaces_default) }}
    admiral_kernel_pid_max_effective: >-
      {{ (admiral_kernel_pid_max | string)
         if admiral_kernel_pid_max is defined and admiral_kernel_pid_max is not none and (admiral_kernel_pid_max | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_KERNEL_PID_MAX') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_KERNEL_PID_MAX') | string | length) > 0
               else admiral_kernel_pid_max_default) }}
    admiral_user_tasks_max_effective: >-
      {{ (admiral_user_tasks_max | string)
         if admiral_user_tasks_max is defined and admiral_user_tasks_max is not none and (admiral_user_tasks_max | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_USER_TASKS_MAX') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_USER_TASKS_MAX') | string | length) > 0
               else admiral_user_tasks_max_default) }}
    admiral_user_nofile_hard_effective: >-
      {{ (admiral_user_nofile_hard | string)
         if admiral_user_nofile_hard is defined and admiral_user_nofile_hard is not none and (admiral_user_nofile_hard | string | length) > 0
         else ((lookup('ansible.builtin.env', 'ADMIRAL_USER_NOFILE_HARD') | string)
               if (lookup('ansible.builtin.env', 'ADMIRAL_USER_NOFILE_HARD') | string | length) > 0
               else admiral_user_nofile_hard_default) }}
    admiral_capacity_sources:
      userns_size: >-
        {{ 'ansible-variable' if (admiral_userns_size | string | length > 0) and (admiral_userns_size | string) != (lookup('ansible.builtin.env', 'ADMIRAL_USERNS_SIZE') | default(admiral_userns_size_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_USERNS_SIZE') | string | length) > 0 else 'role-default') }}
      subid_count: >-
        {{ 'ansible-variable' if (admiral_subid_count | string | length > 0) and (admiral_subid_count | string) != (lookup('ansible.builtin.env', 'ADMIRAL_SUBID_COUNT') | default(admiral_subid_count_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_SUBID_COUNT') | string | length) > 0 else 'role-default') }}
      podman_num_locks: >-
        {{ 'ansible-variable' if (admiral_podman_num_locks | string | length > 0) and (admiral_podman_num_locks | string) != (lookup('ansible.builtin.env', 'ADMIRAL_PODMAN_NUM_LOCKS') | default(admiral_podman_num_locks_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_PODMAN_NUM_LOCKS') | string | length) > 0 else 'role-default') }}
      max_user_namespaces: >-
        {{ 'ansible-variable' if (admiral_max_user_namespaces | string | length > 0) and (admiral_max_user_namespaces | string) != (lookup('ansible.builtin.env', 'ADMIRAL_MAX_USER_NAMESPACES') | default(admiral_max_user_namespaces_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_MAX_USER_NAMESPACES') | string | length) > 0 else 'role-default') }}
      kernel_pid_max: >-
        {{ 'ansible-variable' if (admiral_kernel_pid_max | string | length > 0) and (admiral_kernel_pid_max | string) != (lookup('ansible.builtin.env', 'ADMIRAL_KERNEL_PID_MAX') | default(admiral_kernel_pid_max_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_KERNEL_PID_MAX') | string | length) > 0 else 'role-default') }}
      user_tasks_max: >-
        {{ 'ansible-variable' if (admiral_user_tasks_max | string | length > 0) and (admiral_user_tasks_max | string) != (lookup('ansible.builtin.env', 'ADMIRAL_USER_TASKS_MAX') | default(admiral_user_tasks_max_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_USER_TASKS_MAX') | string | length) > 0 else 'role-default') }}
      user_nofile_hard: >-
        {{ 'ansible-variable' if (admiral_user_nofile_hard | string | length > 0) and (admiral_user_nofile_hard | string) != (lookup('ansible.builtin.env', 'ADMIRAL_USER_NOFILE_HARD') | default(admiral_user_nofile_hard_default, true) | string)
           else ('controller-environment' if (lookup('ansible.builtin.env', 'ADMIRAL_USER_NOFILE_HARD') | string | length) > 0 else 'role-default') }}

- name: Build Podman configuration using resolved capacity values
  set_fact:
    admiral_podman_userns_value: >-
      {{ 'auto:size=' ~ admiral_userns_size_effective
         if admiral_userns_size_effective | length > 0 else 'auto' }}
    admiral_podman_config_content: |
      [containers]
      userns = "auto"

      [engine]
      num_locks = {{ admiral_podman_num_locks_effective }}
    admiral_podman_environment_content: |
      PODMAN_USERNS={{ 'auto:size=' ~ admiral_userns_size_effective if admiral_userns_size_effective | length > 0 else 'auto' }}

- name: Validate rootless Podman capacity settings before changing the host
  assert:
    that:
      - admiral_userns_size_effective == '' or (admiral_userns_size_effective is match('^[1-9][0-9]*$'))
      - admiral_subid_count_effective == 'max_available' or (admiral_subid_count_effective is match('^[1-9][0-9]*$'))
      - admiral_podman_num_locks_effective is match('^[1-9][0-9]*$')
      - admiral_max_user_namespaces_effective is match('^[1-9][0-9]*$')
      - admiral_kernel_pid_max_effective is match('^[1-9][0-9]*$')
      - admiral_user_tasks_max_effective is match('^[1-9][0-9]*$')
      - admiral_user_nofile_hard_effective is match('^[1-9][0-9]*$')
    fail_msg: >-
      Rootless Podman capacity settings are invalid. Use positive integers;
      ADMIRAL_SUBID_COUNT also accepts max_available. No capacity configuration
      has been applied.

- name: Report effective rootless Podman capacity settings
  debug:
    msg:
      userns: "{{ admiral_podman_userns_value }} ({{ admiral_capacity_sources.userns_size }})"
      subid_count: "{{ admiral_subid_count_effective }} ({{ admiral_capacity_sources.subid_count }})"
      podman_num_locks: "{{ admiral_podman_num_locks_effective }} ({{ admiral_capacity_sources.podman_num_locks }})"
      max_user_namespaces: "{{ admiral_max_user_namespaces_effective }} ({{ admiral_capacity_sources.max_user_namespaces }})"
      kernel_pid_max: "{{ admiral_kernel_pid_max_effective }} ({{ admiral_capacity_sources.kernel_pid_max }})"
      user_tasks_max: "{{ admiral_user_tasks_max_effective }} ({{ admiral_capacity_sources.user_tasks_max }})"
      user_nofile_hard: "{{ admiral_user_nofile_hard_effective }} ({{ admiral_capacity_sources.user_nofile_hard }})"

- name: Install admiral-fleet
  dnf:
    name: admiral-fleet
    state: present

- name: Read SELinux permission for rootless cgroup management
  command:
    argv:
      - getsebool
      - container_manage_cgroup
  register: admiral_container_manage_cgroup
  changed_when: false
  when: ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'

- name: Allow rootless containers to manage delegated cgroups
  command:
    argv:
      - setsebool
      - -P
      - container_manage_cgroup
      - "on"
  when:
    - ansible_facts.get('selinux', {}).get('status', 'disabled') == 'enabled'
    - "'--> on' not in admiral_container_manage_cgroup.stdout"

- name: Resolve rootless workload UID
  command:
    argv:
      - id
      - -u
      - admiral-apps
  register: admiral_apps_uid
  changed_when: false

- name: Inspect existing rootless Podman database before applying namespace defaults
  stat:
    path: /var/lib/admiral-apps/.local/share/containers/storage/libpod/bolt_state.db
  register: admiral_rootless_podman_database

- name: Inspect Admiral Podman configuration drop-in
  stat:
    path: /var/lib/admiral-apps/.config/containers/containers.conf.d/90-admiral.conf
  register: admiral_rootless_podman_config

- name: Inspect Admiral Podman environment configuration
  stat:
    path: /var/lib/admiral-apps/.config/environment.d/90-admiral-podman.conf
  register: admiral_rootless_podman_environment

- name: Read existing Admiral Podman configuration drop-in
  slurp:
    src: /var/lib/admiral-apps/.config/containers/containers.conf.d/90-admiral.conf
  register: admiral_rootless_podman_config_contents
  when:
    - admiral_rootless_podman_database.stat.exists
    - admiral_rootless_podman_config.stat.exists

- name: Read existing Admiral Podman environment configuration
  slurp:
    src: /var/lib/admiral-apps/.config/environment.d/90-admiral-podman.conf
  register: admiral_rootless_podman_environment_contents
  when:
    - admiral_rootless_podman_database.stat.exists
    - admiral_rootless_podman_environment.stat.exists

- name: Refuse to change Podman namespace or lock settings on an existing store
  assert:
    that:
      - >-
        not admiral_rootless_podman_database.stat.exists or
        (admiral_rootless_podman_config.stat.exists and
         admiral_rootless_podman_config_contents.content | b64decode == admiral_podman_config_content)
      - >-
        not admiral_rootless_podman_database.stat.exists or
        (admiral_rootless_podman_environment.stat.exists and
         admiral_rootless_podman_environment_contents.content | b64decode == admiral_podman_environment_content)
    fail_msg: >-
      Admiral Podman storage already exists with different or missing UID/GID
      namespace or lock configuration. Reassigning mappings or changing num_locks
      could break existing containers and volumes; migration is not automatic.

- name: Read current user namespace kernel limit
  command: sysctl -n user.max_user_namespaces
  register: admiral_current_user_max_namespaces
  changed_when: false

- name: Read current kernel PID limit
  command: sysctl -n kernel.pid_max
  register: admiral_current_kernel_pid_max
  changed_when: false

- name: Read current fs.nr_open ceiling
  command: sysctl -n fs.nr_open
  register: admiral_current_fs_nr_open
  changed_when: false

- name: Read current systemd user slice task limit
  command:
    argv:
      - systemctl
      - show
      - "user-{{ admiral_apps_uid.stdout }}.slice"
      - --property=TasksMax
      - --value
  register: admiral_current_user_slice_tasks_max
  changed_when: false

- name: Read current systemd user manager task limit
  command:
    argv:
      - systemctl
      - show
      - "user@{{ admiral_apps_uid.stdout }}.service"
      - --property=TasksMax
      - --value
  register: admiral_current_user_manager_tasks_max
  changed_when: false

- name: Read current systemd user manager nofile limits
  command:
    argv:
      - systemctl
      - show
      - "user@{{ admiral_apps_uid.stdout }}.service"
      - "--property={{ item }}"
      - --value
  loop:
    - LimitNOFILESoft
    - LimitNOFILE
  register: admiral_current_user_manager_nofile
  changed_when: false

- name: Calculate effective host limits without lowering existing settings
  set_fact:
    admiral_max_user_namespaces_effective_host: "{{ [admiral_current_user_max_namespaces.stdout | int, admiral_max_user_namespaces_effective | int] | max }}"
    admiral_kernel_pid_max_effective_host: "{{ [admiral_current_kernel_pid_max.stdout | int, admiral_kernel_pid_max_effective | int] | max }}"
    admiral_user_slice_tasks_max_effective_host: >-
      {{ 'infinity' if admiral_current_user_slice_tasks_max.stdout | lower == 'infinity'
         else ([admiral_current_user_slice_tasks_max.stdout | int, admiral_user_tasks_max_effective | int] | max) }}
    admiral_user_manager_tasks_max_effective_host: >-
      {{ 'infinity' if admiral_current_user_manager_tasks_max.stdout | lower == 'infinity'
         else ([admiral_current_user_manager_tasks_max.stdout | int, admiral_user_tasks_max_effective | int] | max) }}
    admiral_user_nofile_soft_effective_host: >-
      {{ 'infinity' if admiral_current_user_manager_nofile.results[0].stdout | lower == 'infinity'
         else ([admiral_current_user_manager_nofile.results[0].stdout | int, admiral_user_nofile_hard_effective | int] | max) }}
    admiral_user_nofile_hard_effective_host: >-
      {{ 'infinity' if admiral_current_user_manager_nofile.results[1].stdout | lower == 'infinity'
         else ([admiral_current_user_manager_nofile.results[1].stdout | int, admiral_user_nofile_hard_effective | int] | max) }}

- name: Ensure requested nofile ceiling is supported by the kernel
  assert:
    that:
      - admiral_user_nofile_hard_effective_host == 'infinity' or (admiral_user_nofile_hard_effective_host | int <= admiral_current_fs_nr_open.stdout | int)
    fail_msg: >-
      The effective Admiral nofile hard limit exceeds fs.nr_open on this host.
      Raise fs.nr_open explicitly or reduce ADMIRAL_USER_NOFILE_HARD.

- name: Persist effective kernel capacity defaults
  ansible.builtin.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-admiral-container-capacity.conf
    sysctl_set: true
    reload: true
  loop:
    - name: user.max_user_namespaces
      value: "{{ admiral_max_user_namespaces_effective_host }}"
    - name: kernel.pid_max
      value: "{{ admiral_kernel_pid_max_effective_host }}"

- name: Create admiral-apps Podman configuration directory
  file:
    path: /var/lib/admiral-apps/.config/containers/containers.conf.d
    state: directory
    owner: admiral-apps
    group: admiral-apps
    mode: "0700"

- name: Configure Podman automatic user namespace and lock capacity
  copy:
    dest: /var/lib/admiral-apps/.config/containers/containers.conf.d/90-admiral.conf
    content: "{{ admiral_podman_config_content }}"
    owner: admiral-apps
    group: admiral-apps
    mode: "0644"

- name: Create admiral-apps systemd environment configuration directory
  file:
    path: /var/lib/admiral-apps/.config/environment.d
    state: directory
    owner: admiral-apps
    group: admiral-apps
    mode: "0700"

- name: Set Podman user namespace default for admiral-apps user services
  copy:
    dest: /var/lib/admiral-apps/.config/environment.d/90-admiral-podman.conf
    content: "{{ admiral_podman_environment_content }}"
    owner: admiral-apps
    group: admiral-apps
    mode: "0644"

- name: Create systemd user slice capacity drop-in directory
  file:
    path: "/etc/systemd/system/user-{{ admiral_apps_uid.stdout }}.slice.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure aggregate Admiral user task limit
  copy:
    dest: "/etc/systemd/system/user-{{ admiral_apps_uid.stdout }}.slice.d/90-admiral-capacity.conf"
    content: |
      [Slice]
      TasksMax={{ admiral_user_slice_tasks_max_effective_host }}
    owner: root
    group: root
    mode: "0644"

- name: Create systemd user manager capacity drop-in directory
  file:
    path: "/etc/systemd/system/user@{{ admiral_apps_uid.stdout }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Admiral user manager task and file descriptor limits
  copy:
    dest: "/etc/systemd/system/user@{{ admiral_apps_uid.stdout }}.service.d/90-admiral-capacity.conf"
    content: |
      [Service]
      TasksMax={{ admiral_user_manager_tasks_max_effective_host }}
      LimitNOFILE={{ admiral_user_nofile_soft_effective_host }}:{{ admiral_user_nofile_hard_effective_host }}
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd after applying Admiral capacity configuration
  systemd:
    daemon_reload: true

- name: Allocate non-overlapping subordinate IDs for rootless workloads
  command:
    argv:
      - /usr/bin/admiral-rootless-subids
      - --user
      - admiral-apps
      - --count
      - "{{ admiral_subid_count_effective }}"
  register: admiral_rootless_subid_result
  changed_when: "'allocated subordinate ID ranges' in admiral_rootless_subid_result.stdout"

- name: Report effective subordinate ID pool
  debug:
    msg: "{{ admiral_rootless_subid_result.stdout_lines }}"

- name: Enable linger for admiral-apps (rootless workload persistence)
  command: loginctl enable-linger admiral-apps
  args:
    creates: /var/lib/systemd/linger/admiral-apps

- name: Enable and start systemd-machined
  systemd:
    name: systemd-machined.service
    state: started

- name: Start persistent rootless user manager
  systemd:
    name: "user@{{ admiral_apps_uid.stdout }}.service"
    state: started

- name: Wait for rootless user D-Bus
  wait_for:
    path: "/run/user/{{ admiral_apps_uid.stdout }}/bus"
    state: present
    timeout: 30

- name: Read current admiral-apps user manager environment
  command:
    argv:
      - runuser
      - -u
      - admiral-apps
      - --
      - env
      - HOME=/var/lib/admiral-apps
      - "XDG_RUNTIME_DIR=/run/user/{{ admiral_apps_uid.stdout }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ admiral_apps_uid.stdout }}/bus"
      - systemctl
      - --user
      - show-environment
  register: admiral_user_manager_environment
  changed_when: false

- name: Apply Podman user namespace default to the running user manager
  command:
    argv:
      - runuser
      - -u
      - admiral-apps
      - --
      - env
      - HOME=/var/lib/admiral-apps
      - "XDG_RUNTIME_DIR=/run/user/{{ admiral_apps_uid.stdout }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ admiral_apps_uid.stdout }}/bus"
      - systemctl
      - --user
      - set-environment
      - "PODMAN_USERNS={{ admiral_podman_userns_value }}"
  when: "('PODMAN_USERNS=' ~ admiral_podman_userns_value) not in admiral_user_manager_environment.stdout_lines"

- name: Verify rootless Podman storage ownership
  command:
    argv:
      - runuser
      - -u
      - admiral-apps
      - --
      - env
      - HOME=/var/lib/admiral-apps
      - "XDG_RUNTIME_DIR=/run/user/{{ admiral_apps_uid.stdout }}"
      - "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ admiral_apps_uid.stdout }}/bus"
      - podman
      - info
      - --format
      - "{{ '{{.Store.GraphRoot}}' }}"
    chdir: /
  register: admiral_rootless_graph_root
  changed_when: false
  failed_when: admiral_rootless_graph_root.stdout != '/var/lib/admiral-apps/.local/share/containers/storage'

- name: Check for Admirald-managed known host inventory
  stat:
    path: /var/lib/admiral/know_host.yaml
  register: admiral_known_hosts_file

- name: Read Admirald-managed known host inventory
  slurp:
    src: /var/lib/admiral/know_host.yaml
  register: admiral_known_hosts_slurp
  when: admiral_known_hosts_file.stat.exists

- name: Decode Admirald-managed known host inventory
  set_fact:
    admiral_known_hosts_inventory: "{{ admiral_known_hosts_slurp.content | b64decode | from_yaml }}"
  when: admiral_known_hosts_file.stat.exists

- name: Resolve effective fleet node id
  set_fact:
    fleet_node_id_effective: >-
      {{
        ansible_facts['hostname']
        if admiral_install_mode == 'single-node'
        else (
          fleet_node_id
          | default((admiral_known_hosts_inventory.next.worker.node_id | default('')), true)
          | default(ansible_facts['hostname'])
        )
      }}

- name: Require remote control-plane settings for worker-node installs
  assert:
    that:
      - (fleet_api_url | default('')) != '' or (admiral_admin_endpoint | default('')) != '' or (admiral_admin_wireguard_ip | default('')) != ''
    fail_msg: "worker-node installs require an admin endpoint or explicit fleet_api_url."
  when: admiral_install_mode == 'worker-node'

- name: Require VPN addresses for secure worker installs
  assert:
    that:
      - (admiral_wireguard_ip | default('')) != ''
      - (admiral_admin_wireguard_ip | default('')) != ''
    fail_msg: "Secure worker installs require both worker and admin WireGuard addresses."
  when:
    - admiral_install_mode == 'worker-node'
    - not (admiral_dev_mode | default(false) | bool)

- name: Derive remote control-plane URLs for worker-node installs
  set_fact:
    admiral_admin_api_host: "{{ admiral_admin_wireguard_ip | default(admiral_admin_endpoint) }}"
    admiral_fleet_api_url: "{{ fleet_api_url | default('https://' ~ (admiral_admin_wireguard_ip | default(admiral_admin_endpoint)) ~ ':8080') }}"
  when: admiral_install_mode == 'worker-node'

- name: Check for existing Fleet node token
  slurp:
    src: /etc/admiral/fleet.env
  register: fleet_existing_env
  failed_when: false
  no_log: true

- name: Extract existing Fleet node token
  set_fact:
    fleet_existing_node_token: >-
      {{ (fleet_existing_env.content | default('') | b64decode
          | regex_findall('(?m)^ADMIRAL_FLEET_TOKEN=(.*)$') | first | default('')) }}
  no_log: true

- name: Preserve existing Fleet storage credentials
  set_fact:
    fleet_existing_s3_access_key: >-
      {{ (fleet_existing_env.content | default('') | b64decode
          | regex_findall('(?m)^ADMIRAL_S3_ACCESS_KEY_ID=(.*)$') | first | default('')) }}
    fleet_existing_s3_secret_key: >-
      {{ (fleet_existing_env.content | default('') | b64decode
          | regex_findall('(?m)^ADMIRAL_S3_SECRET_ACCESS_KEY=(.*)$') | first | default('')) }}
  no_log: true

- name: Generate random Fleet node token
  set_fact:
    fleet_node_token_value: >-
      {{
        fleet_existing_node_token
        if fleet_existing_node_token not in ['', '__REQUIRED__']
        else (admiral_fleet_token_value | default(lookup('ansible.builtin.pipe', 'openssl rand -hex 32')))
      }}
  no_log: true

- name: Deploy admiral-fleet configuration
  copy:
    dest: /etc/admiral/fleet.env
    content: |
      ADMIRAL_FLEET_NODE_ID={{ ansible_facts['hostname'] if admiral_install_mode == 'single-node' else (fleet_node_id_effective | default(fleet_node_id | default(ansible_facts['hostname']))) }}
      ADMIRAL_FLEET_TOKEN={{ fleet_node_token_value }}
      ADMIRAL_API_URL={{ admiral_fleet_api_url | default(admiral_control_plane_url) }}
      ADMIRAL_API_CA_FILE=/etc/admiral/tls/ca.pem
      ADMIRAL_FLEET_EXECUTOR={{ fleet_executor | default('systemd-podman') }}
      ADMIRAL_FLEET_DATA_DIR=/var/lib/admiral
      ADMIRAL_FLEET_CALLBACK_OUTBOX=/var/lib/admiral/outbox
      ADMIRAL_FLEET_HTTP_ADDR={{ fleet_http_addr | default('127.0.0.1:9099' if admiral_install_mode == 'single-node' else (admiral_wireguard_ip ~ ':9099')) }}
      ADMIRAL_FLEET_PUBLISH_ADDRESS={{ '0.0.0.0' if (admiral_dev_mode | default(false) | bool) else ('127.0.0.1' if admiral_install_mode == 'single-node' else admiral_wireguard_ip) }}
      ADMIRAL_FLEET_ADMIN_WIREGUARD_IP={{ admiral_admin_wireguard_ip | default('') }}
      ADMIRAL_FLEET_ROOTLESS_USER={{ fleet_rootless_user | default('admiral-apps') }}
      ADMIRAL_TASK_PUBLIC_KEY={{ admiral_task_public_key_value }}
      ADMIRAL_FLEET_CALLBACK_KEY={{ admiral_fleet_callback_key_value }}
      {% set s3_access_key = admiral_s3_access_key_value | default(fleet_existing_s3_access_key | default('')) %}
      {% set s3_secret_key = admiral_s3_secret_key_value | default(fleet_existing_s3_secret_key | default('')) %}
      {% if s3_access_key != '' and s3_secret_key != '' %}
      ADMIRAL_S3_ACCESS_KEY_ID={{ s3_access_key }}
      ADMIRAL_S3_SECRET_ACCESS_KEY={{ s3_secret_key }}
      {% endif %}
    mode: "0600"
    owner: root
    group: admiral
  no_log: true
  notify: restart admiral-fleet

# Fleet uses the bare hostname in --single-node.
# Remote worker-node installs use either an explicit --node-id or the next
# worker assignment from know_host.yaml.
- name: Read admin token from controller environment for worker registration
  slurp:
    src: /etc/admiral/secrets
  delegate_to: localhost
  register: admiral_controller_fleet_env
  no_log: true
  when: admiral_install_mode == 'worker-node'

- name: Resolve admin token from controller environment for worker registration
  set_fact:
    admiral_admin_token_value: >-
      {{ admiral_controller_fleet_env.content | b64decode
         | regex_findall('(?m)^ADMIRAL_INTERNAL_TOKEN=(.*)$') | first | default('', true) | trim }}
  no_log: true
  when: admiral_install_mode == 'worker-node'

- name: Require non-empty admin token for worker registration
  assert:
    that:
      - admiral_admin_token_value is defined
      - admiral_admin_token_value | length > 0
    fail_msg: "ADMIRAL_INTERNAL_TOKEN is empty in /etc/admiral/secrets on the admin controller. Regenerate or repair controller secrets before worker registration."
  no_log: true
  when: admiral_install_mode == 'worker-node'

- name: Register node with admirald before starting Fleet
  command: >
    /usr/bin/admiralctl nodes register
    --id "{{ ansible_facts['hostname'] if admiral_install_mode == 'single-node' else (fleet_node_id_effective | default(fleet_node_id | default(ansible_facts['hostname']))) }}"
    --hostname "{{ ansible_facts['fqdn'] }}"
    --ip "{{ ansible_facts.get('default_ipv4', {}).get('address') or admiral_wireguard_ip | default('') }}"
    --role "{{ fleet_node_role | default('worker') }}"
    --wireguard-ip "{{ admiral_wireguard_ip | default('') }}"
    --public-ip "{{ fleet_public_ip | default('') }}"
    --os "{{ ansible_facts['distribution'] ~ ' ' ~ ansible_facts['distribution_version'] }}"
  delegate_to: localhost
  environment:
    ADMIRAL_SERVER_URL: "{{ admiral_control_plane_url }}"
    ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
    ADMIRAL_INTERNAL_TOKEN: "{{ admiral_admin_token_value | default(admiral_internal_token_value | default('', true), true) }}"
    ADMIRAL_NODE_TOKEN: "{{ fleet_node_token_value }}"
  no_log: true

- name: Read active hub WireGuard peers before registering the worker
  command:
    argv:
      - wg
      - show
      - wg-admiral
      - allowed-ips
  delegate_to: localhost
  register: admiral_hub_wireguard_allowed_ips
  changed_when: false
  failed_when: false
  no_log: true
  when: admiral_install_mode == 'worker-node'

- name: Require the hub WireGuard interface before registering the worker
  assert:
    that:
      - admiral_hub_wireguard_allowed_ips.rc == 0
    fail_msg: "The admin node WireGuard interface wg-admiral is unavailable; start the hub VPN before registering a worker."
  when: admiral_install_mode == 'worker-node'

- name: Add and persist the registered worker peer under the shared WireGuard lock
  command:
    argv:
      - /usr/libexec/admiral-wireguard-peer-add
      - "{{ fleet_node_id_effective | default(fleet_node_id | default(ansible_facts['hostname'])) }}"
      - "{{ admiral_wireguard_ip }}"
      - "{{ admiral_wg_public_key.stdout | trim }}"
  delegate_to: localhost
  environment:
    ADMIRAL_SERVER_URL: "{{ admiral_control_plane_url }}"
    ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
    ADMIRAL_INTERNAL_TOKEN: "{{ admiral_admin_token_value | default(admiral_internal_token_value | default('', true), true) }}"
  register: admiral_wireguard_peer_add_result
  changed_when: admiral_wireguard_peer_add_result.stdout == 'changed'
  no_log: true
  when: admiral_install_mode == 'worker-node'

- name: Enable and start admiral-fleet after worker registration
  systemd:
    name: admiral-fleet
    enabled: true
    state: started
    daemon_reload: true

- name: Apply admiral-fleet configuration changes after worker registration
  meta: flush_handlers

- name: Wait for the registered Fleet worker to report a healthy heartbeat
  block:
    - name: Poll the worker record until Fleet heartbeat and metrics are current
      command:
        argv:
          - /usr/bin/admiralctl
          - nodes
          - show
          - "{{ ansible_facts['hostname'] if admiral_install_mode == 'single-node' else (fleet_node_id_effective | default(fleet_node_id | default(ansible_facts['hostname']))) }}"
      delegate_to: localhost
      environment:
        ADMIRAL_SERVER_URL: "{{ admiral_control_plane_url }}"
        ADMIRAL_TLS_CA_FILE: /etc/admiral/tls/ca.pem
        ADMIRAL_INTERNAL_TOKEN: "{{ admiral_admin_token_value | default(admiral_internal_token_value | default('', true), true) }}"
      register: admiral_fleet_heartbeat
      changed_when: false
      no_log: true
      retries: 24
      delay: 5
      until: >-
        (admiral_fleet_heartbeat.stdout | from_json).get('last_heartbeat') is not none
        and (admiral_fleet_heartbeat.stdout | from_json).get('last_metrics_at') is not none
        and (admiral_fleet_heartbeat.stdout | from_json).get('fleet_version', '') | length > 0
        and (admiral_fleet_heartbeat.stdout | from_json).get('health_status', '') == 'healthy'
  rescue:
    - name: Read admiral-fleet service state after readiness timeout
      command:
        argv:
          - /usr/bin/systemctl
          - show
          - admiral-fleet.service
          - -p
          - ActiveState
          - -p
          - SubState
          - -p
          - ExecMainStatus
      register: admiral_fleet_service_state
      changed_when: false
      failed_when: false

    - name: Read recent admiral-fleet journal after readiness timeout
      command:
        argv:
          - /usr/bin/journalctl
          - --unit
          - admiral-fleet.service
          - --no-pager
          - -n
          - "40"
      register: admiral_fleet_journal
      changed_when: false
      failed_when: false

    - name: Fail installation when the worker heartbeat is missing
      fail:
        msg: >-
          Fleet worker '{{ ansible_facts['hostname'] if admiral_install_mode == 'single-node' else (fleet_node_id_effective | default(fleet_node_id | default(ansible_facts['hostname']))) }}'
          did not report a healthy heartbeat within 120 seconds. Service state:
          {{ admiral_fleet_service_state.stdout | default('unavailable') }}.
          Recent Fleet journal:
          {{ admiral_fleet_journal.stdout | default('unavailable') }}
  when: not (admiral_defer_fleet_heartbeat | default(false) | bool)
