---
- name: Install auditd
  dnf:
    name: audit
    state: present

- name: Ensure audit rules directory exists
  file:
    path: /etc/audit/rules.d
    state: directory
    mode: "0750"

- name: Deploy Admiral audit rules baseline
  copy:
    dest: /etc/audit/rules.d/admiral.rules
    mode: "0640"
    owner: root
    group: root
    content: |
      ## Admiral baseline audit watches
      -w /etc/admiral -p wa -k admiral_config
      -w /etc/admiral/secrets -p war -k admiral_secrets
      -w /etc/admiral/tls -p war -k admiral_tls
      -w /var/lib/admiral -p wa -k admiral_data
      -w /etc/wireguard -p war -k admiral_wireguard

- name: Enable and start auditd
  systemd:
    name: auditd
    enabled: true
    state: started

- name: Detect audit rule loader availability
  command:
    cmd: command -v augenrules
  register: augenrules_available
  changed_when: false
  failed_when: false

- name: Detect auditctl availability
  command:
    cmd: command -v auditctl
  register: auditctl_available
  changed_when: false
  failed_when: false

- name: Load audit rules with augenrules
  command:
    cmd: augenrules --load
  changed_when: false
  register: audit_augenrules
  failed_when: false
  when: augenrules_available.rc == 0

- name: Load audit rules via auditctl when augenrules is unavailable
  command:
    cmd: auditctl -R /etc/audit/rules.d/admiral.rules
  changed_when: false
  when:
    - augenrules_available.rc != 0 or (audit_augenrules.rc | default(1)) != 0
    - auditctl_available.rc == 0


- name: Verify Admiral audit rules are loaded
  command:
    cmd: auditctl -l
  register: admiral_audit_rules_effective
  changed_when: false
  failed_when: >-
    admiral_audit_rules_effective.rc != 0 or
    'admiral_config' not in admiral_audit_rules_effective.stdout or
    'admiral_secrets' not in admiral_audit_rules_effective.stdout or
    'admiral_tls' not in admiral_audit_rules_effective.stdout or
    'admiral_data' not in admiral_audit_rules_effective.stdout or
    'admiral_wireguard' not in admiral_audit_rules_effective.stdout
  when: auditctl_available.rc == 0

- name: Confirm audit rules file when audit rule loader utilities are unavailable
  ansible.builtin.stat:
    path: /etc/audit/rules.d/admiral.rules
  register: audit_rules_file
  changed_when: false
  when:
    - auditctl_available.rc != 0
    - augenrules_available.rc != 0

- name: Restart auditd when audit rule loader utilities are unavailable
  systemd:
    name: auditd
    state: restarted
  when:
    - auditctl_available.rc != 0
    - augenrules_available.rc != 0

- name: Assert audit rules file is present when audit rule loader utilities are unavailable
  ansible.builtin.assert:
    that:
      - audit_rules_file.stat.exists
    fail_msg: "Admiral audit rules file is missing and no audit rule loader utility is available."
  when:
    - auditctl_available.rc != 0
    - augenrules_available.rc != 0
