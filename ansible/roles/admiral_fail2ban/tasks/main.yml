---
- name: Install fail2ban packages
  block:
    - name: Install fail2ban and firewalld backend
      dnf:
        name:
          - fail2ban
          - fail2ban-firewalld
        state: present

    - name: Ensure fail2ban jail.d exists
      file:
        path: /etc/fail2ban/jail.d
        state: directory
        mode: "0755"

    - name: Ensure fail2ban filter.d exists
      file:
        path: /etc/fail2ban/filter.d
        state: directory
        mode: "0755"

    - name: Deploy admiral-flagship fail2ban filter
      copy:
        dest: /etc/fail2ban/filter.d/admiral-flagship.conf
        mode: "0644"
        content: |
          [Definition]
          failregex = ^.*\[client <HOST>\].*admin login failed.*$
          ignoreregex =

    - name: Deploy admiral-harbor fail2ban filter
      copy:
        dest: /etc/fail2ban/filter.d/admiral-harbor.conf
        mode: "0644"
        content: |
          [Definition]
          failregex = ^.*\[client <HOST>\].*(customer login failed|admin login failed).*$
          ignoreregex =

    - name: Configure admiral fail2ban baseline
      copy:
        dest: /etc/fail2ban/jail.d/admiral.local
        mode: "0644"
        content: |
          [DEFAULT]
          bantime = 1h
          findtime = 10m
          maxretry = 5
          # EL10 uses the nftables firewalld backend. The legacy
          # firewallcmd-ipset action depends on xt_set and can report a ban
          # without installing an effective rule on minimal VPS kernels.
          banaction = nftables[type=allports]
          banaction_allports = nftables[type=allports]

          [sshd]
          enabled = true
          backend = systemd

          [admiral-flagship]
          enabled = {{ 'true' if admiral_install_mode in ['single-node', 'admin-node', 'admin-portal-node'] else 'false' }}
          backend = systemd
          journalmatch = _SYSTEMD_UNIT=admiral-flagship.service
          filter = admiral-flagship
          maxretry = 5
          findtime = 10m
          bantime = 1h
          banaction = nftables[type=allports]

          [admiral-harbor]
          enabled = {{ 'true' if admiral_install_mode in ['single-node', 'admin-portal-node', 'portal-node'] else 'false' }}
          backend = systemd
          journalmatch = _SYSTEMD_UNIT=admiral-harbor.service
          filter = admiral-harbor
          maxretry = 5
          findtime = 10m
          bantime = 1h
          banaction = nftables[type=allports]

    - name: Enable and start fail2ban
      command: fail2ban-client -t
      changed_when: false

    - name: Enable and start fail2ban service
      systemd:
        name: fail2ban
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Exercise Fail2ban nftables enforcement
      block:
        - name: Add a temporary documentation-range ban
          command:
            cmd: fail2ban-client set sshd banip 192.0.2.1
          changed_when: false

        - name: Read active Fail2ban nftables rules
          command:
            cmd: nft list ruleset
          register: admiral_fail2ban_nft_rules
          changed_when: false

        - name: Verify the temporary ban is enforced by nftables
          assert:
            that:
              - "'192.0.2.1' in admiral_fail2ban_nft_rules.stdout"
            fail_msg: >-
              Fail2ban accepted a ban but did not install an effective
              nftables rule.
      always:
        - name: Remove the temporary documentation-range ban
          command:
            cmd: fail2ban-client set sshd unbanip 192.0.2.1
          changed_when: false
          failed_when: false
