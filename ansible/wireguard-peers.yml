---
# WireGuard peer exchange playbook.
#
# admiral-install invokes this after a Worker and independent Portal are both
# registered. Node removal also invokes it with the departing node excluded.
# It collects public keys from active spokes and reconciles hub, spoke and
# Worker-to-Portal WireGuard/firewall state. Operators may also run it with a
# trusted inventory to repair a manually changed cluster.
#
# Usage:
#   ansible-playbook -i hosts.ini wireguard-peers.yml
#
# Inventory groups:
#   [admin]   - one admin node (VPN hub)
#   [workers] - zero or more worker nodes
#   [portal]  - zero or one portal node

- name: Collect WireGuard public keys from all nodes
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Read WireGuard public key
      slurp:
        src: /etc/wireguard/admiral.pub
      register: wg_pub_slurp

    - name: Store public key as fact
      set_fact:
        node_wg_public_key: "{{ wg_pub_slurp.content | b64decode | trim }}"

    # The configuration template needs the node's private key. Read it from
    # the managed node, never from the Ansible controller filesystem.
    - name: Read WireGuard private key from node
      slurp:
        src: /etc/wireguard/admiral.key
      register: wg_private_key_slurp
      no_log: true

    - name: Store private key as fact for this node
      set_fact:
        node_wg_private_key: "{{ wg_private_key_slurp.content | b64decode | trim }}"
      no_log: true

- name: Read Admirald-managed know_host inventory on hub
  hosts: admin
  gather_facts: false
  become: true
  pre_tasks:
    - name: Set the default WireGuard subnet when no custom subnet is configured
      set_fact:
        admiral_wireguard_subnet: "10.99.0.0/24"
      when: admiral_wireguard_subnet is not defined

    - name: Derive the WireGuard hub address when no explicit address is configured
      set_fact:
        admiral_wireguard_hub_ip: "{{ admiral_wireguard_subnet | wireguard_hub_ip }}"
      when: admiral_wireguard_hub_ip is not defined

  tasks:
    - name: Stat know_host inventory before reading
      stat:
        path: /var/lib/admiral/know_host.yaml
      register: know_host_stat

    - name: Fail if know_host inventory is missing
      fail:
        msg: "know_host.yaml not found on admin node. Run admirald bootstrap and verify /var/lib/admiral/know_host.yaml exists before exchanging WireGuard peers."
      when: not know_host_stat.stat.exists

    - name: Read know_host inventory
      slurp:
        src: /var/lib/admiral/know_host.yaml
      register: know_host_slurp

    - name: Decode know_host inventory
      set_fact:
        admiral_known_hosts_inventory: "{{ know_host_slurp.content | b64decode | from_yaml }}"

- name: Register each spoke's public key on the hub
  hosts: workers:portal
  gather_facts: false
  become: true
  vars:
    hub_host: "{{ groups['admin'][0] }}"
    admiral_wireguard_subnet: "{{ hostvars[hub_host].admiral_wireguard_subnet }}"
    node_lookup_key: "{{ hostvars[inventory_hostname].fleet_node_id | default(hostvars[inventory_hostname].admiral_node_name | default(inventory_hostname)) }}"
  tasks:
    - name: Check for an existing per-peer preshared key
      stat:
        path: "/etc/wireguard/peers.d/{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.conf"
      register: peer_fragment_stat
      delegate_to: "{{ hub_host }}"

    - name: Read existing per-peer preshared key
      slurp:
        src: "/etc/wireguard/peers.d/{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.conf"
      register: peer_fragment_content
      when: peer_fragment_stat.stat.exists
      delegate_to: "{{ hub_host }}"
      no_log: true

    - name: Preserve existing per-peer preshared key
      set_fact:
        node_wg_preshared_key: >-
          {{
            (peer_fragment_content.content | b64decode
             | regex_findall('(?m)^PresharedKey\s*=\s*(.+)$') | first | default('') | trim)
            if peer_fragment_stat.stat.exists else ''
          }}
      no_log: true

    - name: Generate per-peer preshared key on hub when absent
      command: wg genpsk
      register: generated_peer_preshared_key
      when: node_wg_preshared_key | default('') | trim == ''
      delegate_to: "{{ hub_host }}"
      changed_when: true
      no_log: true

    - name: Set generated per-peer preshared key
      set_fact:
        node_wg_preshared_key: "{{ generated_peer_preshared_key.stdout | trim }}"
      when: node_wg_preshared_key | default('') | trim == ''
      no_log: true

    - name: Write spoke peer config to hub
      copy:
        content: |
          [Peer]
          PublicKey = {{ hostvars[inventory_hostname].node_wg_public_key }}
          AllowedIPs = {{ hostvars[hub_host].admiral_known_hosts_inventory.nodes[node_lookup_key].wireguard_ip }}/32
          PresharedKey = {{ node_wg_preshared_key }}
        dest: "/etc/wireguard/peers.d/{{ inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}.conf"
        owner: root
        group: root
        mode: "0600"
      delegate_to: "{{ hub_host }}"
      no_log: true

- name: Build and deploy hub WireGuard configuration
  hosts: admin
  gather_facts: false
  become: true
  tasks:
    - name: Find peer config files on hub
      find:
        paths: /etc/wireguard/peers.d
        patterns: "*.conf"
        file_type: file
      register: hub_peer_file_paths

    - name: Read all peer config files from hub
      slurp:
        src: "{{ item }}"
      loop: "{{ hub_peer_file_paths.files | map(attribute='path') | list }}"
      register: peer_files
      no_log: true

    - name: Initialize peer list for template
      set_fact:
        admiral_wireguard_peers: []

    - name: Build peer list for template
      set_fact:
        admiral_wireguard_peers: "{{ admiral_wireguard_peers + [{'public_key': (item.content | b64decode | regex_findall('(?m)^PublicKey\\s*=\\s*(.+)$') | first | trim), 'allowed_ips': (item.content | b64decode | regex_findall('(?m)^AllowedIPs\\s*=\\s*(.+)$') | first | trim), 'preshared_key': (item.content | b64decode | regex_findall('(?m)^PresharedKey\\s*=\\s*(.+)$') | first | default('') | trim)}] }}"
      loop: "{{ peer_files.results }}"
      no_log: true

    - name: Debug peer list
      debug:
        var: admiral_wireguard_peers
      no_log: true

    - name: Deploy hub WireGuard configuration
      template:
        src: roles/admiral_wireguard/templates/wg-admiral.conf.j2
        dest: /etc/wireguard/wg-admiral.conf
        mode: "0600"
      vars:
        admiral_wireguard_role: hub
        admiral_wireguard_ip: "{{ admiral_wireguard_hub_ip }}"
        admiral_wg_private_key:
          stdout: "{{ node_wg_private_key }}"
        admiral_wireguard_port: "51820"
        admiral_wireguard_peers: "{{ admiral_wireguard_peers }}"
      no_log: true
      notify: restart wireguard

  handlers:
    - name: restart wireguard
      systemd:
        name: wg-quick@wg-admiral
        state: restarted
        daemon_reload: true

- name: Update spoke WireGuard configurations with hub public key
  hosts: workers:portal
  gather_facts: false
  become: true
  vars:
    hub_host: "{{ groups['admin'][0] }}"
    admiral_wireguard_subnet: "{{ hostvars[hub_host].admiral_wireguard_subnet }}"
    node_lookup_key: "{{ hostvars[inventory_hostname].fleet_node_id | default(hostvars[inventory_hostname].admiral_node_name | default(inventory_hostname)) }}"
  tasks:
    - name: Select dedicated Portal and Worker peers for uploaded restores
      set_fact:
        admiral_wireguard_spoke_peer_hosts: >-
          {{
            (groups['portal'] | default([]))
            if inventory_hostname in (groups['workers'] | default([]))
            else (groups['workers'] | default([]))
            if inventory_hostname in (groups['portal'] | default([]))
            else []
          }}

    - name: Initialize direct spoke peer list
      set_fact:
        admiral_wireguard_spoke_peers: []

    - name: Add exact Worker-to-Portal WireGuard peers
      set_fact:
        admiral_wireguard_spoke_peers: >-
          {{ admiral_wireguard_spoke_peers + [{
            'public_key': hostvars[item].node_wg_public_key,
            'wireguard_ip': peer_wireguard_ip,
            'endpoint': peer_endpoint
          }] }}
      loop: "{{ admiral_wireguard_spoke_peer_hosts }}"
      vars:
        peer_node_lookup_key: "{{ hostvars[item].fleet_node_id | default(hostvars[item].admiral_node_name | default(item)) }}"
        peer_wireguard_ip: "{{ hostvars[hub_host].admiral_known_hosts_inventory.nodes[peer_node_lookup_key].wireguard_ip }}"
        peer_endpoint: "{{ hostvars[item].ansible_host | default(hostvars[item].fleet_public_ip | default(hostvars[item].ansible_facts['default_ipv4']['address'])) }}"
      when:
        - peer_wireguard_ip != hostvars[hub_host].admiral_wireguard_hub_ip
        - peer_wireguard_ip != hostvars[hub_host].admiral_known_hosts_inventory.nodes[node_lookup_key].wireguard_ip

    - name: Deploy spoke WireGuard configuration
      template:
        src: roles/admiral_wireguard/templates/wg-admiral.conf.j2
        dest: /etc/wireguard/wg-admiral.conf
        mode: "0600"
      vars:
        admiral_wireguard_role: spoke
        admiral_wireguard_hub_ip: "{{ hostvars[hub_host].admiral_wireguard_hub_ip }}"
        admiral_wireguard_hub_public_key: "{{ hostvars[hub_host].node_wg_public_key }}"
        admiral_wireguard_hub_endpoint: "{{ hostvars[hub_host].ansible_host | default(hostvars[hub_host].fleet_public_ip | default(hostvars[hub_host].ansible_facts['default_ipv4']['address'])) }}"
        admiral_wireguard_ip: "{{ hostvars[hub_host].admiral_known_hosts_inventory.nodes[node_lookup_key].wireguard_ip }}"
        admiral_wg_private_key:
          stdout: "{{ node_wg_private_key }}"
        admiral_wireguard_port: "51820"
        admiral_wireguard_preshared_key: "{{ hostvars[inventory_hostname].node_wg_preshared_key }}"
      no_log: true
      notify: restart wireguard

  handlers:
    - name: restart wireguard
      systemd:
        name: wg-quick@wg-admiral
        state: restarted
        daemon_reload: true

- name: Reconcile exact Worker access to the dedicated Portal restore endpoint
  hosts: "portal:!admin"
  gather_facts: false
  become: true
  vars:
    hub_host: "{{ groups['admin'][0] }}"
  tasks:
    - name: Initialize registered Worker WireGuard addresses
      set_fact:
        admiral_wireguard_worker_ips: []

    - name: Collect exact registered Worker WireGuard addresses
      set_fact:
        admiral_wireguard_worker_ips: "{{ admiral_wireguard_worker_ips + [worker_wireguard_ip] }}"
      loop: "{{ groups['workers'] | default([]) }}"
      vars:
        worker_node_lookup_key: "{{ hostvars[item].fleet_node_id | default(hostvars[item].admiral_node_name | default(item)) }}"
        worker_wireguard_ip: "{{ hostvars[hub_host].admiral_known_hosts_inventory.nodes[worker_node_lookup_key].wireguard_ip }}"
      when: worker_wireguard_ip != hostvars[hub_host].admiral_wireguard_hub_ip

    - name: Read existing Portal WireGuard-zone rich rules
      command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=admiral
          - --list-rich-rules
      register: admiral_portal_existing_rich_rules
      changed_when: false

    - name: Identify stale Worker Harbor rules
      set_fact:
        admiral_portal_stale_worker_rules: >-
          {{
            admiral_portal_existing_rich_rules.stdout_lines
            | stale_wireguard_harbor_rules(
                admiral_wireguard_worker_ips,
                hostvars[hub_host].admiral_wireguard_subnet,
                hostvars[hub_host].admiral_wireguard_hub_ip
              )
          }}

    - name: Remove stale Worker-to-Portal Harbor rules
      command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=admiral
          - "--remove-rich-rule={{ item }}"
      loop: "{{ admiral_portal_stale_worker_rules }}"
      register: admiral_portal_removed_worker_rules
      changed_when: "'ALREADY_DISABLED' not in admiral_portal_removed_worker_rules.stderr"

    - name: Permit each registered Worker to reach Harbor over WireGuard
      command:
        argv:
          - firewall-cmd
          - --permanent
          - --zone=admiral
          - >-
            --add-rich-rule=rule family="ipv4" source address="{{ item }}/32"
            port port="5001" protocol="tcp" accept
      loop: "{{ admiral_wireguard_worker_ips }}"
      register: admiral_portal_added_worker_rules
      changed_when: "'ALREADY_ENABLED' not in admiral_portal_added_worker_rules.stderr"

    - name: Reload firewalld after direct Worker rule reconciliation
      command:
        cmd: firewall-cmd --reload
      when: >-
        (admiral_portal_removed_worker_rules.changed | default(false)) or
        (admiral_portal_added_worker_rules.changed | default(false))

    - name: Verify each registered Worker Harbor rule is active
      command:
        argv:
          - firewall-cmd
          - --zone=admiral
          - >-
            --query-rich-rule=rule family="ipv4" source address="{{ item }}/32"
            port port="5001" protocol="tcp" accept
      loop: "{{ admiral_wireguard_worker_ips }}"
      register: admiral_portal_worker_rule_checks
      changed_when: false
      failed_when: admiral_portal_worker_rule_checks.rc != 0
