name: e2e-portal-free
display_name: E2E Portal Free
description: Minimal free customer-facing app for validating independent Harbor portal flows.

services:
  app:
    image: docker.io/traefik/whoami:v1.10
    port: 80
    public: true
    backup:
      type: none

  db:
    image: docker.io/library/postgres:16
    volume: db_data
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: portal_audit
    secrets:
      POSTGRES_USER:
        generate: username
        expose: true
      POSTGRES_PASSWORD:
        generate: password
        expose: true
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    healthcheck_wait_timeout: 120

tiers:
  free:
    cpu: 1
    memory: 512M
    storage: 2G
    price_monthly: 0
    free: true
    backups:
      enabled: true
      schedule: disabled
      retention:
        count: 7
        days: 30
      manual_backups: true
      backup_database: true
      backup_volumes: false
      restore_allowed: true
