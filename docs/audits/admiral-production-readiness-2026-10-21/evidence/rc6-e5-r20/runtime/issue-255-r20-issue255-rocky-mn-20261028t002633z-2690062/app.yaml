name: r20-issue255-rocky-mn-20261028t002633z-2690062
display_name: R20 issue 255 r20-issue255-rocky-mn-20261028t002633z-2690062
description: Disposable R20 migration and S3 backup validation.

services:
  database:
    image: docker.io/library/postgres:16
    volume: db_data
    env:
      POSTGRES_DB: issue255
    secrets:
      POSTGRES_USER:
        generate: username
        expose: true
      POSTGRES_PASSWORD:
        generate: password
        expose: true
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    healthcheck_wait_timeout: 120
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD

tiers:
  small:
    cpu: 1
    memory: 128M
    storage: 1G
    price_monthly: 0
    free: true
    backups:
      enabled: true
      schedule: disabled
      retention:
        count: 7
        days: 30
      manual_backups: true
      backup_database: true
      backup_volumes: false
      restore_allowed: true
