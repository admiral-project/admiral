name: erpnext
display_name: ERPNext 15
description: |
  Stress app for the Admiral app-definition contract.

  This definition exercises multi-service topology, shared volumes,
  one-time setup, dependency readiness, exposed secrets, and customer
  notices after setup.

shared_volumes:
  sites:
    mount: /home/frappe/frappe-bench/sites
    services:
      - backend
      - setup
      - websocket
      - scheduler
      - worker-default

services:
  frontend:
    image: docker.io/frappe/erpnext:v15.10.0
    port: 8080
    public: true
    command: nginx-entrypoint.sh
    depends_on:
      - backend
    requires:
      - backend
    env:
      BACKEND: 127.0.0.1:8000
      SOCKETIO: 127.0.0.1:9000
      FRAPPE_SITE_NAME_HEADER: frontend
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
    backup:
      type: none

  backend:
    image: docker.io/frappe/erpnext:v15.10.0
    depends_on:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    requires:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      FRAPPE_SITE_NAME_HEADER: frontend
      REDIS_CACHE: 127.0.0.1:6379
      REDIS_QUEUE: 127.0.0.1:6380
      REDIS_SOCKETIO: 127.0.0.1:6381
    secrets:
      MARIADB_ROOT_PASSWORD:
        generate: password
    healthcheck:
      type: tcp
      port: 8000
    backup:
      type: volume

  setup:
    image: docker.io/frappe/erpnext:v15.10.0
    command: sh -c "sleep infinity"
    setup_command: bench new-site --mariadb-user-host-login-scope='%' --db-root-username root --db-root-password $MARIADB_ROOT_PASSWORD --admin-password $ERP_ADMIN_PASSWORD --install-app erpnext --set-default frontend
    notify_on_setup:
      - label: Usuario administrador
        value: Administrator
    depends_on:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    requires:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      FRAPPE_SITE_NAME_HEADER: frontend
      REDIS_CACHE: 127.0.0.1:6379
      REDIS_QUEUE: 127.0.0.1:6380
      REDIS_SOCKETIO: 127.0.0.1:6381
    secrets:
      MARIADB_ROOT_PASSWORD:
        generate: password
      ERP_ADMIN_PASSWORD:
        generate: password
        expose: true
    backup:
      type: none

  websocket:
    image: docker.io/frappe/erpnext:v15.10.0
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    env:
      FRAPPE_SITE_NAME_HEADER: frontend
      FRAPPE_REDIS_CACHE: redis://127.0.0.1:6379
      FRAPPE_REDIS_QUEUE: redis://127.0.0.1:6380
      FRAPPE_REDIS_SOCKETIO: redis://127.0.0.1:6381
    backup:
      type: none

  db:
    image: docker.io/library/mariadb:10.11
    volume: erp_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-character-set-client-handshake
    env:
      MARIADB_DATABASE: erpnext
    secrets:
      MARIADB_ROOT_PASSWORD:
        generate: password
      MARIADB_USER:
        generate: username
        expose: true
      MARIADB_PASSWORD:
        generate: password
        expose: true
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" --silent
    healthcheck_wait_timeout: 180
    backup:
      type: database
      engine: mariadb
      database_env: MARIADB_DATABASE
      username_env: MARIADB_USER
      password_env: MARIADB_PASSWORD

  redis-cache:
    image: docker.io/library/redis:7-alpine
    port: 6379
    command: redis-server --port 6379 --maxmemory 2gb
    healthcheck:
      type: command
      command: ["redis-cli", "-p", "6379", "ping"]
    backup:
      type: none

  redis-queue:
    image: docker.io/library/redis:7-alpine
    port: 6380
    command: redis-server --port 6380 --maxmemory 2gb
    healthcheck:
      type: command
      command: ["redis-cli", "-p", "6380", "ping"]
    backup:
      type: none

  redis-socketio:
    image: docker.io/library/redis:7-alpine
    port: 6381
    command: redis-server --port 6381 --maxmemory 512mb
    healthcheck:
      type: command
      command: ["redis-cli", "-p", "6381", "ping"]
    backup:
      type: none

  scheduler:
    image: docker.io/frappe/erpnext:v15.10.0
    command: bench schedule
    depends_on:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    requires:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    env:
      FRAPPE_SITE_NAME_HEADER: frontend
      FRAPPE_REDIS_CACHE: redis://127.0.0.1:6379
      FRAPPE_REDIS_QUEUE: redis://127.0.0.1:6380
      FRAPPE_REDIS_SOCKETIO: redis://127.0.0.1:6381
    backup:
      type: none

  worker-default:
    image: docker.io/frappe/erpnext:v15.10.0
    command: bench worker --queue default
    depends_on:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    requires:
      - db
      - redis-cache
      - redis-queue
      - redis-socketio
    env:
      FRAPPE_SITE_NAME_HEADER: frontend
      FRAPPE_REDIS_CACHE: redis://127.0.0.1:6379
      FRAPPE_REDIS_QUEUE: redis://127.0.0.1:6380
      FRAPPE_REDIS_SOCKETIO: redis://127.0.0.1:6381
    backup:
      type: none

tiers:
  dev:
    cpu: 0.5
    memory: 256M
    storage: 1G
    price_monthly: 0
    free: true

  production-s:
    cpu: 1
    memory: 2G
    storage: 10G
    price_monthly: 20
    backups:
      enabled: true
      schedule: daily
      retention:
        count: 7
        days: 30
      backup_database: true
      backup_volumes: true

  production-m:
    cpu: 2
    memory: 4G
    storage: 20G
    price_monthly: 40
    backups:
      enabled: true
      schedule: daily
      retention:
        count: 7
        days: 30
      backup_database: true
      backup_volumes: true

  production-l:
    cpu: 4
    memory: 8G
    storage: 50G
    price_monthly: 80
    backups:
      enabled: true
      schedule: daily
      retention:
        count: 14
        days: 60
      backup_database: true
      backup_volumes: true
