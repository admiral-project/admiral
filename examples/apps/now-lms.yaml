name: now-lms
display_name: NOW-LMS
description: Learning Management System — crea, entrega y certifica cursos.

services:
  app:
    image: quay.io/bmosoluciones/now_lms
    port: 8080
    public: true
    depends_on:
      - db
    requires:
      - db
    healthcheck:
      type: http
      path: /
      expected_status: 200
    healthcheck_wait_timeout: 120
    env:
      NOW_LMS_AUTO_MIGRATE: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/nowlms
    secrets:
      POSTGRES_USER:
        generate: username
      POSTGRES_PASSWORD:
        generate: password
      SECRET_KEY:
        generate: password
        expose: true
    backup:
      type: none

  db:
    image: docker.io/library/postgres:16
    volume: lms_db
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: nowlms
    secrets:
      POSTGRES_USER:
        generate: username
        expose: true
      POSTGRES_PASSWORD:
        generate: password
        expose: true
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    healthcheck_wait_timeout: 60

tiers:
  small:
    cpu: 1
    memory: 512M
    storage: 1G
    price_monthly: 5
    backups:
      enabled: true
      schedule: daily
      time: "03:00"
      timezone: UTC
      retention:
        count: 3
        days: 14
      backup_database: true
      backup_volumes: false
