name: wp
display_name: WordPress
description: The open source publishing platform.

environment:
  WORDPRESS_DB_HOST: 127.0.0.1
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_SITE_TITLE: WordPress
  WORDPRESS_ADMIN_EMAIL: admin@empresa.local

secrets:
  WORDPRESS_DB_USER:
    generate: username
  WORDPRESS_DB_PASSWORD:
    generate: password
  MARIADB_ROOT_PASSWORD:
    generate: password

shared_volumes:
  site:
    mount: /var/www/html
    services:
      - web
      - setup

services:
  web:
    image: docker.io/library/wordpress:6
    port: 80
    public: true
    depends_on:
      - db
    requires:
      - db
    healthcheck:
      type: tcp
      port: 80
    healthcheck_wait_timeout: 120
    backup:
      type: volume
    env:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}

  setup:
    image: docker.io/library/wordpress:cli
    command: sh -c "sleep infinity"
    depends_on:
      - db
      - web
    requires:
      - db
    setup_command: wp core is-installed --path=/var/www/html --allow-root || wp core install --path=/var/www/html --url=https://$ADMIRAL_INSTANCE_ID.local --title=\"$WORDPRESS_SITE_TITLE\" --admin_user=$WORDPRESS_ADMIN_USER --admin_password=$WORDPRESS_ADMIN_PASSWORD --admin_email=$WORDPRESS_ADMIN_EMAIL --skip-email --allow-root
    env:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_SITE_TITLE: ${WORDPRESS_SITE_TITLE}
      WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL}
    secrets:
      WORDPRESS_ADMIN_USER:
        generate: username
        expose: true
      WORDPRESS_ADMIN_PASSWORD:
        generate: password
        expose: true
    backup:
      type: none

  db:
    image: docker.io/library/mariadb:10
    volume: db_data
    backup:
      type: database
      engine: mariadb
      database_env: MARIADB_DATABASE
      username_env: MARIADB_USER
      password_env: MARIADB_PASSWORD
    env:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    secrets:
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - mariadb-admin ping -h 127.0.0.1 -uroot -p"$MARIADB_ROOT_PASSWORD" --silent
    healthcheck_wait_timeout: 120

tiers:
  small:
    cpu: 1
    memory: 512M
    storage: 1G
    price_monthly: 5
    backups:
      enabled: true
      schedule: daily
      time: "02:00"
      timezone: UTC
      retention:
        count: 7
        days: 30
      backup_database: true
      backup_volumes: true
