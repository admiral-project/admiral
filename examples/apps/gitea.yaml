name: gitea
display_name: Gitea
description: Self-hosted Git service.

secrets:
  DB_USER:
    generate: username
  DB_PASSWORD:
    generate: password

services:
  web:
    image: docker.io/gitea/gitea:1.22
    port: 3000
    public: true
    volume: gitea_data
    user: "1000"
    depends_on:
      - db
    requires:
      - db
    setup_command: mkdir -p /data/gitea/conf && printf '[server]\nROOT_URL = %s\nSSH_PORT = %s\n\n[database]\nDB_TYPE = %s\nHOST = %s\nNAME = %s\nUSER = %s\nPASSWD = %s\n\n[security]\nINSTALL_LOCK = true\n' "$ROOT_URL" "$SSH_PORT" "$DB_TYPE" "$DB_HOST" "$DB_NAME" "$DB_USER" "$DB_PASSWORD" > /data/gitea/conf/app.ini && gitea migrate && (gitea admin user list --admin | grep -F "$GITEA_ADMIN_USERNAME" || gitea admin user create --username "$GITEA_ADMIN_USERNAME" --password "$GITEA_ADMIN_PASSWORD" --email "$GITEA_ADMIN_EMAIL" --admin)
    backup:
      type: volume
    env:
      DB_TYPE: postgres
      DB_HOST: 127.0.0.1:5432
      DB_NAME: gitea
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ROOT_URL: http://127.0.0.1:3000/
      SSH_PORT: "2222"
      GITEA_ADMIN_EMAIL: admin@example.com
    healthcheck:
      type: tcp
      port: 3000
    secrets:
      GITEA_ADMIN_USERNAME:
        generate: username
        expose: true
      GITEA_ADMIN_PASSWORD:
        generate: password
        expose: true

  db:
    image: docker.io/library/postgres:16
    volume: gitea_db
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: gitea
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    healthcheck_wait_timeout: 180

tiers:
  small:
    cpu: 1
    memory: 1G
    storage: 10G
    price_monthly: 15
