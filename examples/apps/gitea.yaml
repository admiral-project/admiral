name: gitea
display_name: Gitea
description: Self-hosted Git service with PostgreSQL and persistent repositories.

services:
  web:
    image: docker.io/gitea/gitea:1.22
    port: 3000
    public: true
    volume: gitea_data
    depends_on:
      - db
    setup_command: gitea admin user list --admin | grep -F "$GITEA_ADMIN_USERNAME" || gitea admin user create --username "$GITEA_ADMIN_USERNAME" --password "$GITEA_ADMIN_PASSWORD" --email "$GITEA_ADMIN_EMAIL" --admin
    backup:
      type: volume
    env:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: 127.0.0.1:5432
      GITEA__database__NAME: gitea
      ROOT_URL: http://127.0.0.1:3000/
      SSH_PORT: 2222
      GITEA_ADMIN_EMAIL: admin@example.com
    healthcheck:
      type: tcp
      port: 3000
    secrets:
      GITEA__database__USER:
        generate: username
      GITEA__database__PASSWD:
        generate: password
      GITEA_ADMIN_USERNAME:
        generate: username
        expose: true
      GITEA_ADMIN_PASSWORD:
        generate: password
        expose: true

  db:
    image: docker.io/library/postgres:16
    volume: gitea_db
    backup:
      type: database
      engine: postgresql
      database_env: POSTGRES_DB
      username_env: POSTGRES_USER
      password_env: POSTGRES_PASSWORD
    env:
      POSTGRES_DB: gitea
    secrets:
      POSTGRES_USER:
        generate: username
      POSTGRES_PASSWORD:
        generate: password
    healthcheck:
      type: command
      command:
        - sh
        - -c
        - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"

tiers:
  small:
    cpu: 1
    memory: 1G
    storage: 10G
    price_monthly: 15
